      text: "Type and paste. No menus, no extra steps."
    - label: "02 / format"
      text: "DOCX, ODT and TXT with formatting preserved."
    - label: "03 / privacy"
      text: "Your files stay on your computer."

  product:
    kicker: "/ product"
    title: "Designed for your workflow."
    intro: "No interruptions, no extra steps. Just type and paste."
    features:
      - number: "01"
        title: "Instant"
        text_html: "Type <strong>/name</strong> and your template appears instantly. No menus, no extra clicks."
      - number: "02"
        title: "Full formatting"
        text_html: "DOCX, ODT and TXT with bold, tables, images and styles. All formatting is preserved."
      - number: "03"
        title: "100% local"
        text_html: "Your templates stay on your computer. No mandatory cloud, no servers, no hidden subscriptions."

  why:
    kicker: "/ the difference"
    title: "Here, you just type."
    lead_muted: "Other text expanders force you to memorize."
    lead_highlight: "Plantillas Macro finds the file for you."
    diagram:
      step1: "Type /name"
      step2: "Filters in real time"
      step3: "Pastes with formatting"
    items:
      - title: "No abbreviations to memorize"
        text_html: "Most text expanders force you to invent a unique abbreviation for every template — with 50 templates that's 50 codes you can't repeat, and a month later you no longer remember which was which. With Plantillas Macro you type <code>/</code> and any part of the name: <code>/quote</code> instantly filters everything that matches. No memorizing codes like <code>/qt2024v3final</code>."
      - title: "Full Word formatting"
        text_html: "Pastes with bold, tables, images and styles intact. Traditional text expanders usually work with plain text — none of them handle DOCX or ODT for real."
      - title: "No account, no mandatory cloud"
        text_html: "Many text expanders require creating an account and store your templates on their servers. Your files are yours: they stay in your folder, on your computer."
      - title: "Works in any app"
        text_html: "Outlook, Word, CRM, websites, chat, and any Windows application where you can type — no exceptions."
      - title: "Ready in 2 minutes"
        text_html: "Install, point to your folder and start working. No technical setup, no files to edit by hand."
      - title: "Sync without lock-in"
        text_html: "You can point your folder to OneDrive, Dropbox or Google Drive and it syncs itself. Your documents are still plain .docx files — if you ever switch apps, you lose nothing."

  comparison:
    kicker: "/ comparison"
    title: "What makes Plantillas Macro different."
    headers: ["Feature", "Plantillas Macro", "Abbreviation-based expanders", "Browser expanders", "Technical tools"]
    rows:
      - label: "No abbreviations to memorize"
        cells: ["✓", "✕", "✕", "✕"]
      - label: "Full DOCX / ODT formatting"
        cells: ["✓", "✕ plain text", "✕", "✕"]
      - label: "No mandatory account"
        cells: ["✓", "⚠ depends", "✕", "✓"]
      - label: "Works in desktop apps"
        cells: ["✓", "✓", "✕ browser only", "✓"]
      - label: "No learning curve"
        cells: ["✓", "⚠ complex", "✓", "✕ requires code"]
      - label: "Your files, your folder"
        cells: ["✓", "⚠ proprietary format", "✕ cloud", "✓"]
      - label: "14-day free trial"
        cells: ["✓", "⚠ limited", "⚠ limited", "✓ free"]

  pricing:
    kicker: "/ pricing"
    title: "Choose your plan."
    intro: "No commitment. Cancel anytime."
    plans:
      - name: "Monthly"
        tag: ""
