google_auth:

  hero:
    breadcrumb_current: "Google Auth Extractor"
    kicker: "/ free utility · open source"
    title_pre: "Google Auth"
    title_highlight: "Extractor"
    copy_es: "Exporta tus cuentas TOTP de Google Authenticator a TXT, Aegis, 2FAS o CSV."
    copy_en: "Export your Google Authenticator TOTP accounts to TXT, Aegis, 2FAS or CSV."
    chips: ["Python 3.10+", "Windows", "macOS", "Linux", "MIT"]
    cta_github: "View on GitHub"
    cta_download: "Download ZIP →"

  why:
    kicker: "/ why"
    title: "Why does this tool exist?"
    text_es_html: "Google Authenticator exporta las cuentas en un formato propietario (<code>otpauth-migration://</code>) que ninguna otra app puede leer directamente. Cada código QR contiene hasta 10 cuentas. Esta herramienta decodifica esos QR y extrae las claves TOTP para que puedas importarlas donde quieras."
    text_en_html: "Google Authenticator exports accounts in a proprietary format (<code>otpauth-migration://</code>) that no other app can read directly. Each QR code holds up to 10 accounts. This tool decodes those QR codes and extracts the TOTP secrets so you can import them anywhere."

  features:
    kicker: "/ features"
    title: "Everything it includes."
    items:
      - "Paste otpauth-migration:// URL directly"
      - "Upload an image or screenshot of the QR"
      - "Scan a screen region with your mouse"
      - "Accumulates accounts across scans"
      - "Automatic deduplication"
      - "Copy Issuer, Name or Secret"
      - "Spanish and English interface"
      - "Clear the list to start fresh"
      - "Export to TXT, Aegis, 2FAS, CSV"
      - "100% local — no data leaves your computer"

  screenshots:
    kicker: "/ screenshots"
    title: "The tool in action."

  installation:
    kicker: "/ installation"
    title: "Installation."
    step1_label: "1. Clone the repository"
    requirements_html: '<strong>📌 Requirements:</strong> Python 3.10 or higher. During installation on Windows, check <strong>"Add Python to PATH"</strong>.'
    step2_label: "2. Install dependencies"
    linux_note_html: "<strong>🐧 Linux / macOS:</strong> You also need the native zbar library:"

  usage:
    kicker: "/ usage"
    title: "How to run it."
    run_label: "Run"
    windows_note_html: "<strong>💡 Windows with multiple Python versions:</strong>"
    batch_note_html: "Or create a <code>run.bat</code> file:"

  guide:
    kicker: "/ guide"
    title: "Step by step."
    steps:
      - title: "Export from Google Authenticator"
        text_html: 'Open Google Authenticator → menu (⋮) → <strong>Transfer accounts → Export accounts</strong> → select the accounts → one or more QR codes will appear (max 10 accounts per QR).'
      - title: "Import into the app (pick a mode)"
        modes:
          - icon: "🔗"
            title: "URL mode"
            text_html: 'Scan the QR → copy the <code>otpauth-migration://offline?data=...</code> URL → paste it → Extract accounts'
          - icon: "🖼️"
            title: "Image mode"
            text: "Screenshot of the QR → Select image → Read QR and extract"
          - icon: "📷"
            title: "Screen scan mode"
            text: "Show the QR → Select region → draw a rectangle → automatic extraction"
        note: "💡 If you have more than 10 accounts, repeat the process for each QR. Accounts accumulate and duplicates are ignored."
      - title: "Export"
        text: "Once all your accounts are in the list, click the button for the format you need:"
    formats:
      - name: "TXT"
        meta: ".txt"
      - name: "Aegis"
        meta: ".json · Android"
      - name: "2FAS"
        meta: ".2fas · Android/iOS"
      - name: "CSV"
        meta: "Bitwarden, 1Password"

  deps:
    kicker: "/ dependencies"
    title: "What it uses under the hood."
    items:
      - name: "customtkinter"
        text: "graphical interface"
      - name: "pillow"
        text: "image reading"
      - name: "pyzbar"
        text: "QR decoding (primary)"
      - name: "opencv-python"
        text: "QR decoding (fallback)"
      - name: "mss"
        text: "multi-monitor capture"

  troubleshooting:
    kicker: "/ help"
    title: "Troubleshooting."
    items:
      - icon: "fas fa-camera"
        title: "The screen scanner doesn't work"
      - icon: "fab fa-python"
        title: "Multiple Python versions on Windows"
      - icon: "fas fa-qrcode"
        title: "Error importing pyzbar on Windows"
        text_html: "<code>pyzbar</code> requires native libraries. If it fails, <code>opencv-python</code> is used as an automatic fallback."

  security:
    kicker: "/ security"
    title: "No internet connection."
    items:
      - "No network connections"
      - "TOTP secrets stay on your computer"
      - "Full source code available for audit"

  final_cta:
    title: "MIT license."
    text: "Use it, modify it and distribute it freely."
    button: "View repository →"


