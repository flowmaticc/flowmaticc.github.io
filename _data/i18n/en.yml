home:

  hero:
    kicker: "/ smart automation"
    title_pre: "Type /"
    title_highlight: "and your template appears."
    copy_html: >-
      <p><strong>Plantillas Macro</strong> is the Windows text expander that
      pastes your Word, ODT and TXT templates with full formatting into any
      application.</p>
      <p>Type "/" + the name and it pastes instantly. No copying, no opening
      files, no interrupting your flow.</p>
    cta_download: "Download for free →"
    cta_pricing: "View pricing"
    video_aria_label: "Expand product video"
    video_expand_label: "⤢ Expand"
    video_window_title: "PLANTILLAS MACRO"
    video_close_label: "Close"
    video_fallback: "Your browser does not support HTML5 video."

  strip:
