      🔒 Secure payment via Lemon Squeezy · 14-day free trial · Cancel
      anytime.<br><br>Prices shown do not include VAT. Applicable VAT is
      calculated and added at checkout based on the buyer's country of
      residence, and is fully managed by Lemon Squeezy as Merchant of
      Record.<br><br>Need 25 or more licenses for your team or company?
      <a href="mailto:gestiona.optimiza@gmail.com?subject=Volume%20license%20inquiry%20(%2B25)">Contact
      us to find the best solution →</a>

  faq:
    kicker: "/ frequently asked questions"
    title: "Before you start."
    items:
      - q: "Does Plantillas Macro work with Microsoft Word and Outlook?"
        a_html: "Yes. Plantillas Macro works in any Windows application where you can type: Microsoft Word, Outlook, Excel, Google Chrome, Firefox, Slack, Teams, web CRMs, and any other program. It doesn't depend on Word — it works at the operating system level."
      - q: "Can I use my existing .docx and .odt templates?"
        a_html: "Yes. Simply point to the folder where you keep your .docx, .odt or .txt files and Plantillas Macro detects them automatically. No need to convert or import them — your Word files remain normal Word files."
      - q: "Does it keep full formatting when pasting — bold, tables, images?"
        a_html: "Yes, this is the main advantage over other text expanders. Plantillas Macro pastes DOCX or ODT content with all formatting intact: bold, italics, tables, lists, embedded images and paragraph styles. Classic expanders only paste plain text."
      - q: "Are my templates uploaded to any server or cloud?"
        a_html: "No. Plantillas Macro runs 100% locally — your files never leave your computer. There's no user account or proprietary server. If you want sync between computers, just point the folder to OneDrive, Dropbox or Google Drive."
      - q: "How much does it cost and is there a free trial?"
        a_html: "There's a 14-day free trial with all features included, no credit card required. After that, plans start from €3.90/month + VAT. You can cancel anytime from the Lemon Squeezy panel with no penalties."
      - q: "Which Windows versions are supported?"
        a_html: "Plantillas Macro is compatible with Windows 10 and Windows 11 (64-bit). It doesn't require Microsoft Office — it works with any application on the system. There's no macOS or Linux version at this time."
      - q: "How is it different from AutoHotkey or other expanders like Espanso?"
        a_html: "AutoHotkey requires writing scripts — it's not for non-technical users. Espanso and other expanders handle plain text or markdown, but don't paste DOCX files with full formatting. Plantillas Macro is built for people who work with real Word documents and want to paste them into any app without opening Word."
      - q: "Can I use the same license on more than one computer?"
        a_html: 'Each license allows one simultaneous activation. If you need to use it on several computers, you can deactivate the previous one from within the software itself. For teams or companies with 25 or more licenses, <a href="mailto:gestiona.optimiza@gmail.com">contact us</a> for a custom price.'

  final_cta:
    title: "Ready to work faster?"
    text: "Download Plantillas Macro for free and try every feature for 14 days."
    button: "Download Plantillas Macro →"


