home:

  hero:
    kicker: "/ smart automation"
    title_pre: "Type /"
    title_highlight: "and your template appears."
    copy_html: >-
      <p><strong>Vexo</strong> is the Windows text expander that
      pastes your Word, ODT and TXT templates with full formatting into any
      application.</p>
      <p>Type "/" + the name and it pastes instantly. No copying, no opening
      files, no interrupting your flow.</p>
    cta_download: "Download for free →"
    video_aria_label: "Expand product video"
    video_expand_label: "⤢ Expand"
    video_window_title: "VEXO - EXPANSOR"
    video_close_label: "Close"
    video_fallback: "Your browser does not support HTML5 video."

  strip:
    - label: "01 / speed"
      text: "Type and paste. No menus, no extra steps."
    - label: "02 / format"
      text: "DOCX, ODT and TXT with formatting preserved."
    - label: "03 / privacy"
      text: "Your files stay on your computer."

  product:
    kicker: "/ product"
    title: "Designed for your workflow."
    intro: "No interruptions, no extra steps. Just type and paste."
    features:
      - number: "01"
        title: "Instant"
        text_html: "Type <strong>/name</strong> and your template appears instantly. No menus, no extra clicks."
      - number: "02"
        title: "Full formatting"
        text_html: "DOCX, ODT and TXT with bold, tables, images and styles. All formatting is preserved."
      - number: "03"
        title: "100% local"
        text_html: "Your templates stay on your computer. No mandatory cloud, no servers, no subscriptions."

  why:
    kicker: "/ the difference"
    title: "Here, you just type."
    lead_muted: "Other text expanders force you to memorize."
    lead_highlight: "Vexo finds the file for you."
    diagram:
      step1: "Type /name"
      step2: "Filters in real time"
      step3: "Pastes with formatting"
    items:
      - title: "No abbreviations to memorize"
        text_html: "Most text expanders force you to invent a unique abbreviation for every template — with 50 templates that's 50 codes you can't repeat, and a month later you no longer remember which was which. With Vexo you type <code>/</code> and any part of the name: <code>/quote</code> instantly filters everything that matches. No memorizing codes like <code>/qt2024v3final</code>."
      - title: "Full Word formatting"
        text_html: "Pastes with bold, tables, images and styles intact. Traditional text expanders usually work with plain text — none of them handle DOCX or ODT for real."
      - title: "No account, no mandatory cloud"
        text_html: "Many text expanders require creating an account and store your templates on their servers. Your files are yours: they stay in your folder, on your computer."
      - title: "Works in any app"
        text_html: "Outlook, Word, CRM, websites, chat, and any Windows application where you can type — no exceptions."
      - title: "Ready in 2 minutes"
        text_html: "Install, point to your folder and start working. No technical setup, no files to edit by hand."
      - title: "Sync without lock-in"
        text_html: "You can point your folder to OneDrive, Dropbox or Google Drive and it syncs itself. Your documents are still plain .docx files — if you ever switch apps, you lose nothing."
      - title: "Email signatures with images"
        text_html: "Create your signatures with logos and images in a visual editor, or paste the one you already use in your email or CRM. They show up in the search as «Firma: …» and paste with their formatting into Gmail, Outlook or your ticketing tool."

  comparison:
    kicker: "/ comparison"
    title: "What makes Vexo different."
    headers: ["Feature", "Vexo", "Abbreviation-based expanders", "Browser expanders", "Technical tools"]
    rows:
      - label: "No abbreviations to memorize"
        cells: ["✓", "✕", "✕", "✕"]
      - label: "Full DOCX / ODT formatting"
        cells: ["✓", "✕ plain text", "✕", "✕"]
      - label: "No mandatory account"
        cells: ["✓", "⚠ depends", "✕", "✓"]
      - label: "Works in desktop apps"
        cells: ["✓", "✓", "✕ browser only", "✓"]
      - label: "No learning curve"
        cells: ["✓", "⚠ complex", "✓", "✕ requires code"]
      - label: "Your files, your folder"
        cells: ["✓", "⚠ proprietary format", "✕ cloud", "✓"]
      - label: "Free, with no limits"
        cells: ["✓", "⚠ limited", "⚠ limited", "✓ free"]

  faq:
    kicker: "/ frequently asked questions"
    title: "Before you start."
    items:
      - q: "Does Vexo work with Microsoft Word and Outlook?"
        a_html: "Yes. Vexo works in any Windows application where you can type: Microsoft Word, Outlook, Excel, Google Chrome, Firefox, Slack, Teams, web CRMs, and any other program. It doesn't depend on Word — it works at the operating system level."
      - q: "Can I use my existing .docx and .odt templates?"
        a_html: "Yes. Simply point to the folder where you keep your .docx, .odt or .txt files and Vexo detects them automatically. No need to convert or import them — your Word files remain normal Word files."
      - q: "Does it keep full formatting when pasting — bold, tables, images?"
        a_html: "Yes, this is the main advantage over other text expanders. Vexo pastes DOCX or ODT content with all formatting intact: bold, italics, tables, lists, embedded images and paragraph styles. Classic expanders only paste plain text."
      - q: "Are my templates uploaded to any server or cloud?"
        a_html: "No. Vexo runs 100% locally — your files never leave your computer. There's no user account or proprietary server. If you want sync between computers, just point the folder to OneDrive, Dropbox or Google Drive."
      - q: "How much does it cost?"
        a_html: "Nothing. Vexo is free, with every feature and no template limit. No account, no credit card and no license to activate."
      - q: "Which Windows versions are supported?"
        a_html: "Vexo is compatible with Windows 10 and Windows 11 (64-bit). It doesn't require Microsoft Office — it works with any application on the system. There's no macOS or Linux version at this time."
      - q: "How is it different from AutoHotkey or other expanders like Espanso?"
        a_html: "AutoHotkey requires writing scripts — it's not for non-technical users. Espanso and other expanders handle plain text or markdown, but don't paste DOCX files with full formatting. Vexo is built for people who work with real Word documents and want to paste them into any app without opening Word."
      - q: "Can I install it on several computers?"
        a_html: "Yes, on as many as you like. There are no activations and no device limit. To share the same templates across them, point the folder to OneDrive, Dropbox or Google Drive."
      - q: "Can I save my email signatures with logos and images?"
        a_html: "Yes. In Settings → Signatures you create your signatures in a visual editor or paste the one you already use (copy it with Ctrl+C from your email or CRM). Images are saved with the signature, so they don't depend on any link. Type the trigger and «firma» to paste it in any application."

  final_cta:
    title: "Ready to work faster?"
    text: "Download Vexo for free: every feature, no limits, no sign-up."
    button: "Download Vexo →"


