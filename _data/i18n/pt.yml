      - label: "14 dias de teste grátis"
        cells: ["✓", "⚠ limitado", "⚠ limitado", "✓ grátis"]

  pricing:
    kicker: "/ preço"
    title: "Escolha seu plano."
    intro: "Sem fidelidade. Cancele quando quiser."
    plans:
      - name: "Mensal"
        tag: ""
