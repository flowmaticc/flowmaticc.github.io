      <p><strong>Plantillas Macro</strong> é o expansor de texto para
      Windows que cola seus modelos Word, ODT e TXT com formatação completa
      em qualquer aplicativo.</p>
      <p>Digite "/" + o nome e ele é colado instantaneamente. Sem copiar,
      sem abrir arquivos, sem interromper seu fluxo.</p>
    cta_download: "Baixar grátis →"
    cta_pricing: "Ver preços"
    video_aria_label: "Ampliar vídeo do produto"
    video_expand_label: "⤢ Ampliar"
