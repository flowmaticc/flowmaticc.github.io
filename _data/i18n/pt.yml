google_auth:

  hero:
    breadcrumb_current: "Google Auth Extractor"
    kicker: "/ ferramenta gratuita · código aberto"
    title_pre: "Google Auth"
    title_highlight: "Extractor"
    copy_es: "Exporta tus cuentas TOTP de Google Authenticator a TXT, Aegis, 2FAS o CSV."
    copy_en: "Export your Google Authenticator TOTP accounts to TXT, Aegis, 2FAS or CSV."
    chips: ["Python 3.10+", "Windows", "macOS", "Linux", "MIT"]
    cta_github: "Ver no GitHub"
    cta_download: "Baixar ZIP →"

  why:
    kicker: "/ motivo"
    title: "Por que essa ferramenta existe?"
    text_es_html: "Google Authenticator exporta las cuentas en un formato propietario (<code>otpauth-migration://</code>) que ninguna otra app puede leer directamente. Cada código QR contiene hasta 10 cuentas. Esta herramienta decodifica esos QR y extrae las claves TOTP para que puedas importarlas donde quieras."
    text_en_html: "Google Authenticator exports accounts in a proprietary format (<code>otpauth-migration://</code>) that no other app can read directly. Each QR code holds up to 10 accounts. This tool decodes those QR codes and extracts the TOTP secrets so you can import them anywhere."

  features:
    kicker: "/ recursos"
    title: "Tudo o que inclui."
    items:
      - "Colar URL otpauth-migration:// diretamente"
      - "Enviar imagem ou captura do QR"
      - "Escanear região da tela com o mouse"
      - "Acumula contas entre escaneamentos"
      - "Deduplicação automática"
      - "Copiar Emissor, Nome ou Chave"
      - "Interface em espanhol e inglês"
      - "Limpar a lista para começar do zero"
      - "Exportar para TXT, Aegis, 2FAS, CSV"
      - "100% local — nenhum dado sai do seu computador"

  screenshots:
    kicker: "/ capturas de tela"
    title: "A ferramenta em uso."

  installation:
    kicker: "/ instalação"
    title: "Instalação."
    step1_label: "1. Clone o repositório"
    requirements_html: '<strong>📌 Requisitos:</strong> Python 3.10 ou superior. Durante a instalação no Windows, marque <strong>"Add Python to PATH"</strong>.'
    step2_label: "2. Instale as dependências"
    linux_note_html: "<strong>🐧 Linux / macOS:</strong> Você também precisa da biblioteca nativa zbar:"

  usage:
    kicker: "/ uso"
    title: "Como executar."
    run_label: "Executar"
    windows_note_html: "<strong>💡 Windows com várias versões de Python:</strong>"
    batch_note_html: "Ou crie um arquivo <code>executar.bat</code>:"

  guide:
    kicker: "/ guia"
    title: "Passo a passo."
    steps:
      - title: "Exportar do Google Authenticator"
        text_html: 'Abra o Google Authenticator → menu (⋮) → <strong>Transferir contas → Exportar contas</strong> → selecione as contas → aparecerá um ou mais QR (máximo 10 contas por QR).'
      - title: "Importar no aplicativo (escolha um modo)"
        modes:
          - icon: "🔗"
            title: "Modo URL"
            text_html: 'Escaneie o QR → copie a URL <code>otpauth-migration://offline?data=...</code> → cole-a → Extrair contas'
          - icon: "🖼️"
            title: "Modo imagem"
            text: "Captura de tela do QR → Selecionar imagem → Ler QR e extrair"
          - icon: "📷"
            title: "Modo escaneamento de tela"
            text: "Mostre o QR → Selecionar região → desenhe um retângulo → extração automática"
        note: "💡 Se você tiver mais de 10 contas, repita o processo para cada QR. As contas se acumulam e os duplicados são ignorados."
      - title: "Exportar"
        text: "Com todas as contas na lista, clique no botão do formato que precisar:"
    formats:
      - name: "TXT"
        meta: ".txt"
      - name: "Aegis"
        meta: ".json · Android"
      - name: "2FAS"
        meta: ".2fas · Android/iOS"
      - name: "CSV"
        meta: "Bitwarden, 1Password"

  deps:
    kicker: "/ dependências"
    title: "O que usa internamente."
    items:
      - name: "customtkinter"
        text: "interface gráfica"
      - name: "pillow"
        text: "leitura de imagens"
      - name: "pyzbar"
        text: "decodificação de QR (principal)"
      - name: "opencv-python"
        text: "decodificação de QR (alternativa)"
      - name: "mss"
        text: "captura multi-monitor"

  troubleshooting:
    kicker: "/ ajuda"
    title: "Solução de problemas."
    items:
      - icon: "fas fa-camera"
        title: "O scanner de tela não funciona"
      - icon: "fab fa-python"
        title: "Várias versões de Python no Windows"
      - icon: "fas fa-qrcode"
        title: "Erro ao importar o pyzbar no Windows"
        text_html: "O <code>pyzbar</code> requer bibliotecas nativas. Se falhar, o <code>opencv-python</code> é usado automaticamente como alternativa."

  security:
    kicker: "/ segurança"
    title: "Sem conexão com a internet."
    items:
      - "Sem conexões de rede"
      - "Chaves TOTP permanecem no seu computador"
      - "Código-fonte completo disponível para auditoria"

  final_cta:
    title: "Licença MIT."
    text: "Use, modifique e distribua livremente."
    button: "Ver repositório →"


