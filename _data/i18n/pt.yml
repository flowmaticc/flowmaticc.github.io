home:

  hero:
    kicker: "/ automação inteligente"
    title_pre: "Digite /"
    title_highlight: "e o seu modelo aparece."
    copy_html: >-
      <p><strong>Vexo</strong> é o expansor de texto para
      Windows que cola seus modelos Word, ODT e TXT com formatação completa
      em qualquer aplicativo.</p>
      <p>Digite "/" + o nome e ele é colado instantaneamente. Sem copiar,
      sem abrir arquivos, sem interromper seu fluxo.</p>
    cta_download: "Baixar grátis →"
    video_aria_label: "Ampliar vídeo do produto"
    video_expand_label: "⤢ Ampliar"
    video_window_title: "PLANTILLAS MACRO"
    video_close_label: "Fechar"
    video_fallback: "Seu navegador não suporta vídeo HTML5."

  strip:
    - label: "01 / velocidade"
      text: "Digite e cole. Sem menus nem passos extras."
    - label: "02 / formato"
      text: "DOCX, ODT e TXT com a formatação preservada."
    - label: "03 / privacidade"
      text: "Seus arquivos permanecem no seu computador."

  product:
    kicker: "/ produto"
    title: "Projetado para o seu fluxo de trabalho."
    intro: "Sem interrupções, sem passos extras. Basta digitar e colar."
    features:
      - number: "01"
        title: "Instantâneo"
        text_html: "Digite <strong>/nome</strong> e o seu modelo aparece instantaneamente. Sem menus, sem cliques extras."
      - number: "02"
        title: "Formatação completa"
        text_html: "DOCX, ODT e TXT com negrito, tabelas, imagens e estilos. Toda a formatação é preservada."
      - number: "03"
        title: "100% local"
        text_html: "Seus modelos ficam no seu computador. Sem nuvem obrigatória, sem servidores e sem assinaturas."

  why:
    kicker: "/ a diferença"
    title: "Aqui você só digita."
    lead_muted: "Outros expansores obrigam você a memorizar."
    lead_highlight: "O Vexo procura o arquivo por você."
    diagram:
      step1: "Digite /nome"
      step2: "Filtra em tempo real"
      step3: "Cola com formatação"
    items:
      - title: "Sem abreviações para memorizar"
        text_html: "A maioria dos expansores obriga você a inventar uma abreviação única para cada modelo — com 50 modelos são 50 códigos que não podem se repetir, e um mês depois você já não lembra qual era qual. Com o Vexo você digita <code>/</code> e qualquer parte do nome: <code>/orcamento</code> filtra instantaneamente tudo que corresponde. Nada de memorizar códigos como <code>/orc2024v3final</code>."
      - title: "Formatação completa do Word"
        text_html: "Cola com negrito, tabelas, imagens e estilos intactos. Os expansores tradicionais geralmente trabalham com texto simples — nenhum deles realmente lida com DOCX ou ODT."
      - title: "Sem conta, sem nuvem obrigatória"
        text_html: "Muitos expansores exigem a criação de uma conta e armazenam seus modelos nos servidores deles. Seus arquivos são seus: permanecem na sua pasta, no seu computador."
      - title: "Funciona em qualquer aplicativo"
        text_html: "Outlook, Word, CRM, sites, chat e qualquer aplicativo do Windows onde você possa escrever — sem exceção."
      - title: "Pronto em 2 minutos"
        text_html: "Instale, indique sua pasta e comece a trabalhar. Sem configuração técnica nem arquivos para editar manualmente."
      - title: "Sincronização sem dependência"
        text_html: "Você pode apontar sua pasta para OneDrive, Dropbox ou Google Drive e ela se sincroniza sozinha. Seus documentos continuam sendo arquivos .docx normais — se um dia você mudar de aplicativo, não perde nada."
      - title: "Assinaturas de e-mail com imagens"
        text_html: "Crie suas assinaturas com logos e imagens em um editor visual ou cole a que você já usa no seu e-mail ou CRM. Elas aparecem na pesquisa como «Firma: …» e são coladas com a formatação no Gmail, Outlook ou na sua ferramenta de tickets."

  comparison:
    kicker: "/ comparação"
    title: "O que torna o Vexo diferente."
    headers: ["Característica", "Vexo", "Expansores com abreviações", "Expansores de navegador", "Ferramentas técnicas"]
    rows:
      - label: "Sem abreviações para memorizar"
        cells: ["✓", "✕", "✕", "✕"]
      - label: "Formatação DOCX / ODT completa"
        cells: ["✓", "✕ texto simples", "✕", "✕"]
      - label: "Sem conta obrigatória"
        cells: ["✓", "⚠ depende", "✕", "✓"]
      - label: "Funciona em aplicativos desktop"
        cells: ["✓", "✓", "✕ só navegador", "✓"]
      - label: "Interface sem curva de aprendizado"
        cells: ["✓", "⚠ complexa", "✓", "✕ requer código"]
      - label: "Seus arquivos, sua pasta"
        cells: ["✓", "⚠ formato próprio", "✕ nuvem", "✓"]
      - label: "Grátis e sem limites"
        cells: ["✓", "⚠ limitado", "⚠ limitado", "✓ grátis"]

  faq:
    kicker: "/ perguntas frequentes"
    title: "Antes de começar."
    items:
      - q: "O Vexo funciona com Microsoft Word e Outlook?"
        a_html: "Sim. O Vexo funciona em qualquer aplicativo do Windows onde você possa escrever: Microsoft Word, Outlook, Excel, Google Chrome, Firefox, Slack, Teams, CRMs web e qualquer outro programa. Não depende do Word — funciona no nível do sistema operacional."
      - q: "Posso usar meus modelos .docx e .odt existentes?"
        a_html: "Sim. Basta indicar a pasta onde estão seus arquivos .docx, .odt ou .txt, e o Vexo os detecta automaticamente. Não é preciso convertê-los nem importá-los — seus arquivos Word continuam sendo arquivos Word normais."
      - q: "A formatação completa é mantida ao colar — negrito, tabelas, imagens?"
        a_html: "Sim, essa é a principal vantagem em relação a outros expansores de texto. O Vexo cola o conteúdo DOCX ou ODT com toda a formatação intacta: negrito, itálico, tabelas, listas, imagens incorporadas e estilos de parágrafo. Os expansores clássicos só colam texto simples."
      - q: "Meus modelos são enviados para algum servidor ou nuvem?"
        a_html: "Não. O Vexo funciona 100% localmente — seus arquivos nunca saem do seu computador. Não há conta de usuário nem servidor próprio. Se quiser sincronização entre computadores, basta apontar a pasta para OneDrive, Dropbox ou Google Drive."
      - q: "Quanto custa?"
        a_html: "Nada. O Vexo é grátis, com todas as funções e sem limite de modelos. Sem conta, sem cartão de crédito e sem licença para ativar."
      - q: "Quais versões do Windows são compatíveis?"
        a_html: "O Vexo é compatível com Windows 10 e Windows 11 (64 bits). Não requer o Microsoft Office — funciona com qualquer aplicativo do sistema. Não há versão para macOS nem Linux no momento."
      - q: "Qual a diferença em relação ao AutoHotkey ou outros expansores como o Espanso?"
        a_html: "O AutoHotkey exige escrever scripts — não é para usuários não técnicos. O Espanso e outros expansores lidam com texto simples ou markdown, mas não colam arquivos DOCX com formatação completa. O Vexo foi criado para quem trabalha com documentos Word reais e quer colá-los em qualquer aplicativo sem abrir o Word."
      - q: "Posso instalá-lo em vários computadores?"
        a_html: "Sim, em quantos quiser. Não há ativações nem limite de dispositivos. Para ter os mesmos modelos em todos, aponte a pasta para o OneDrive, Dropbox ou Google Drive."
      - q: "Posso salvar minhas assinaturas de e-mail com logos e imagens?"
        a_html: "Sim. Em Configurações → Assinaturas você cria suas assinaturas em um editor visual ou cola a que já usa (copie com Ctrl+C do seu e-mail ou CRM). As imagens são salvas com a assinatura, então não dependem de nenhum link. Digite o gatilho e «firma» para colá-la em qualquer aplicativo."

  final_cta:
    title: "Pronto para trabalhar mais rápido?"
    text: "Baixe o Vexo grátis: todas as funções, sem limites e sem cadastro."
    button: "Baixar Vexo →"


