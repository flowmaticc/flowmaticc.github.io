    title: "O que torna o Plantillas Macro diferente."
    headers: ["Característica", "Plantillas Macro", "Expansores com abreviações", "Expansores de navegador", "Ferramentas técnicas"]
    rows:
      - label: "Sem abreviações para memorizar"
        cells: ["✓", "✕", "✕", "✕"]
      - label: "Formatação DOCX / ODT completa"
        cells: ["✓", "✕ texto simples", "✕", "✕"]
      - label: "Sem conta obrigatória"
        cells: ["✓", "⚠ depende", "✕", "✓"]
      - label: "Funciona em aplicativos desktop"
        cells: ["✓", "✓", "✕ só navegador", "✓"]
