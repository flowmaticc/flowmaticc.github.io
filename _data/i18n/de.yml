google_auth:

  hero:
    breadcrumb_current: "Google Auth Extractor"
    kicker: "/ kostenloses tool · open source"
    title_pre: "Google Auth"
    title_highlight: "Extractor"
    copy_es: "Exporta tus cuentas TOTP de Google Authenticator a TXT, Aegis, 2FAS o CSV."
    copy_en: "Export your Google Authenticator TOTP accounts to TXT, Aegis, 2FAS or CSV."
    chips: ["Python 3.10+", "Windows", "macOS", "Linux", "MIT"]
    cta_github: "Auf GitHub ansehen"
    cta_download: "ZIP herunterladen →"

  why:
    kicker: "/ warum"
    title: "Warum gibt es dieses Tool?"
    text_es_html: "Google Authenticator exporta las cuentas en un formato propietario (<code>otpauth-migration://</code>) que ninguna otra app puede leer directamente. Cada código QR contiene hasta 10 cuentas. Esta herramienta decodifica esos QR y extrae las claves TOTP para que puedas importarlas donde quieras."
    text_en_html: "Google Authenticator exports accounts in a proprietary format (<code>otpauth-migration://</code>) that no other app can read directly. Each QR code holds up to 10 accounts. This tool decodes those QR codes and extracts the TOTP secrets so you can import them anywhere."

  features:
    kicker: "/ funktionen"
    title: "Alles, was enthalten ist."
    items:
      - "otpauth-migration://-URL direkt einfügen"
      - "Bild oder Screenshot des QR-Codes hochladen"
      - "Bildschirmbereich mit der Maus scannen"
      - "Sammelt Konten über mehrere Scans hinweg"
      - "Automatische Duplikaterkennung"
      - "Aussteller, Name oder Geheimschlüssel kopieren"
      - "Oberfläche auf Spanisch und Englisch"
      - "Liste löschen, um neu zu beginnen"
      - "Export als TXT, Aegis, 2FAS, CSV"
      - "100 % lokal — keine Daten verlassen Ihren Computer"

  screenshots:
    kicker: "/ screenshots"
    title: "Das Tool in Aktion."

  installation:
    kicker: "/ installation"
    title: "Installation."
    step1_label: "1. Repository klonen"
    requirements_html: '<strong>📌 Voraussetzungen:</strong> Python 3.10 oder höher. Aktivieren Sie bei der Installation unter Windows <strong>"Add Python to PATH"</strong>.'
    step2_label: "2. Abhängigkeiten installieren"
    linux_note_html: "<strong>🐧 Linux / macOS:</strong> Sie benötigen außerdem die native zbar-Bibliothek:"

  usage:
    kicker: "/ verwendung"
    title: "So wird es ausgeführt."
    run_label: "Ausführen"
    windows_note_html: "<strong>💡 Windows mit mehreren Python-Versionen:</strong>"
    batch_note_html: "Oder erstellen Sie eine Datei <code>ausfuehren.bat</code>:"

  guide:
    kicker: "/ anleitung"
    title: "Schritt für Schritt."
    steps:
      - title: "Export aus Google Authenticator"
        text_html: 'Öffnen Sie Google Authenticator → Menü (⋮) → <strong>Konten übertragen → Konten exportieren</strong> → wählen Sie die Konten aus → ein oder mehrere QR-Codes erscheinen (max. 10 Konten pro QR-Code).'
      - title: "In die App importieren (Modus wählen)"
        modes:
          - icon: "🔗"
            title: "URL-Modus"
            text_html: 'QR-Code scannen → URL <code>otpauth-migration://offline?data=...</code> kopieren → einfügen → Konten extrahieren'
          - icon: "🖼️"
            title: "Bild-Modus"
            text: "Screenshot des QR-Codes → Bild auswählen → QR lesen und extrahieren"
          - icon: "📷"
            title: "Bildschirm-Scan-Modus"
            text: "QR-Code anzeigen → Bereich auswählen → Rechteck zeichnen → automatische Extraktion"
        note: "💡 Wenn Sie mehr als 10 Konten haben, wiederholen Sie den Vorgang für jeden QR-Code. Konten werden gesammelt, Duplikate werden ignoriert."
      - title: "Exportieren"
        text: "Sobald alle Konten in der Liste sind, klicken Sie auf die Schaltfläche für das gewünschte Format:"
    formats:
      - name: "TXT"
        meta: ".txt"
      - name: "Aegis"
        meta: ".json · Android"
      - name: "2FAS"
        meta: ".2fas · Android/iOS"
      - name: "CSV"
        meta: "Bitwarden, 1Password"

  deps:
    kicker: "/ abhängigkeiten"
    title: "Was intern verwendet wird."
    items:
      - name: "customtkinter"
        text: "grafische Oberfläche"
      - name: "pillow"
        text: "Bildverarbeitung"
      - name: "pyzbar"
        text: "QR-Dekodierung (primär)"
      - name: "opencv-python"
        text: "QR-Dekodierung (Ausweichlösung)"
      - name: "mss"
        text: "Multi-Monitor-Erfassung"

  troubleshooting:
    kicker: "/ hilfe"
    title: "Problembehandlung."
    items:
      - icon: "fas fa-camera"
        title: "Der Bildschirmscanner funktioniert nicht"
      - icon: "fab fa-python"
        title: "Mehrere Python-Versionen unter Windows"
      - icon: "fas fa-qrcode"
        title: "Fehler beim Importieren von pyzbar unter Windows"
        text_html: "<code>pyzbar</code> benötigt native Bibliotheken. Bei einem Fehler wird automatisch <code>opencv-python</code> als Ausweichlösung verwendet."

  security:
    kicker: "/ sicherheit"
    title: "Ohne Internetverbindung."
    items:
      - "Keine Netzwerkverbindungen"
      - "TOTP-Schlüssel bleiben auf Ihrem Computer"
      - "Vollständiger Quellcode zur Prüfung verfügbar"

  final_cta:
    title: "MIT-Lizenz."
    text: "Nutzen, verändern und frei weiterverbreiten."
    button: "Repository ansehen →"


