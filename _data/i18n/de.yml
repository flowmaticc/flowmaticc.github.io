home:

  hero:
    kicker: "/ intelligente automatisierung"
    title_pre: "Tippen Sie /"
    title_highlight: "und Ihre Vorlage erscheint."
    copy_html: >-
      <p><strong>Vexo</strong> ist die Texterweiterung für
      Windows, die Ihre Word-, ODT- und TXT-Vorlagen mit vollständiger
      Formatierung in jede Anwendung einfügt.</p>
      <p>Tippen Sie "/" + den Namen und er wird sofort eingefügt. Kein
      Kopieren, kein Öffnen von Dateien, kein Unterbrechen Ihres Arbeitsflusses.</p>
    cta_download: "Kostenlos herunterladen →"
    video_aria_label: "Produktvideo vergrößern"
    video_expand_label: "⤢ Vergrößern"
    video_window_title: "PLANTILLAS MACRO"
    video_close_label: "Schließen"
    video_fallback: "Ihr Browser unterstützt kein HTML5-Video."

  strip:
    - label: "01 / geschwindigkeit"
      text: "Tippen und einfügen. Ohne Menüs, ohne Umwege."
    - label: "02 / format"
      text: "DOCX, ODT und TXT mit erhaltener Formatierung."
    - label: "03 / datenschutz"
      text: "Ihre Dateien bleiben auf Ihrem Computer."

  product:
    kicker: "/ produkt"
    title: "Entwickelt für Ihren Arbeitsablauf."
    intro: "Keine Unterbrechungen, keine Umwege. Einfach tippen und einfügen."
    features:
      - number: "01"
        title: "Sofort"
        text_html: "Tippen Sie <strong>/Name</strong> und Ihre Vorlage erscheint sofort. Keine Menüs, keine zusätzlichen Klicks."
      - number: "02"
        title: "Vollständige Formatierung"
        text_html: "DOCX, ODT und TXT mit Fettdruck, Tabellen, Bildern und Formatvorlagen. Die gesamte Formatierung bleibt erhalten."
      - number: "03"
        title: "100 % lokal"
        text_html: "Ihre Vorlagen bleiben auf Ihrem Computer. Ohne verpflichtende Cloud, ohne Server und ohne Abonnement."

  why:
    kicker: "/ der unterschied"
    title: "Hier tippen Sie einfach."
    lead_muted: "Andere Texterweiterungen zwingen Sie zum Auswendiglernen."
    lead_highlight: "Vexo sucht die Datei für Sie."
    diagram:
      step1: "Tippen Sie /Name"
      step2: "Filtert in Echtzeit"
      step3: "Fügt mit Formatierung ein"
    items:
      - title: "Keine Abkürzungen zum Merken"
        text_html: "Die meisten Texterweiterungen zwingen Sie, für jede Vorlage eine eigene Abkürzung zu erfinden — bei 50 Vorlagen sind das 50 Codes, die sich nicht wiederholen dürfen, und einen Monat später wissen Sie nicht mehr, welcher welcher war. Mit Vexo tippen Sie <code>/</code> und einen beliebigen Teil des Namens: <code>/angebot</code> filtert sofort alles Passende. Kein Auswendiglernen von Codes wie <code>/ang2024v3final</code>."
      - title: "Vollständige Word-Formatierung"
        text_html: "Fügt mit intaktem Fettdruck, Tabellen, Bildern und Formatvorlagen ein. Herkömmliche Texterweiterungen arbeiten meist mit reinem Text — keine davon verarbeitet DOCX oder ODT wirklich."
      - title: "Kein Konto, keine verpflichtende Cloud"
        text_html: "Viele Texterweiterungen erfordern die Erstellung eines Kontos und speichern Ihre Vorlagen auf ihren Servern. Ihre Dateien gehören Ihnen: Sie bleiben in Ihrem Ordner, auf Ihrem Computer."
      - title: "Funktioniert in jeder Anwendung"
        text_html: "Outlook, Word, CRM, Webseiten, Chat und jede Windows-Anwendung, in der Sie schreiben können — ohne Ausnahme."
      - title: "In 2 Minuten einsatzbereit"
        text_html: "Installieren, Ordner angeben und loslegen. Ohne technische Konfiguration oder Dateien, die manuell bearbeitet werden müssen."
      - title: "Synchronisierung ohne Bindung"
        text_html: "Sie können Ihren Ordner auf OneDrive, Dropbox oder Google Drive verweisen, und er synchronisiert sich selbst. Ihre Dokumente bleiben normale .docx-Dateien — wenn Sie eines Tages die App wechseln, verlieren Sie nichts."
      - title: "E-Mail-Signaturen mit Bildern"
        text_html: "Erstellen Sie Ihre Signaturen mit Logos und Bildern in einem visuellen Editor oder fügen Sie die ein, die Sie bereits in Ihrem E-Mail-Programm oder CRM verwenden. Sie erscheinen in der Suche als «Firma: …» und werden mit ihrer Formatierung in Gmail, Outlook oder Ihr Ticketsystem eingefügt."

  comparison:
    kicker: "/ vergleich"
    title: "Was Vexo anders macht."
    headers: ["Merkmal", "Vexo", "Expander mit Abkürzungen", "Browser-Expander", "Technische Tools"]
    rows:
      - label: "Keine Abkürzungen zum Merken"
        cells: ["✓", "✕", "✕", "✕"]
      - label: "Vollständige DOCX-/ODT-Formatierung"
        cells: ["✓", "✕ Reintext", "✕", "✕"]
      - label: "Kein Konto erforderlich"
        cells: ["✓", "⚠ je nach Fall", "✕", "✓"]
      - label: "Funktioniert in Desktop-Anwendungen"
        cells: ["✓", "✓", "✕ nur Browser", "✓"]
      - label: "Keine Lernkurve"
        cells: ["✓", "⚠ komplex", "✓", "✕ Code erforderlich"]
      - label: "Ihre Dateien, Ihr Ordner"
        cells: ["✓", "⚠ proprietäres Format", "✕ Cloud", "✓"]
      - label: "Kostenlos und ohne Limits"
        cells: ["✓", "⚠ begrenzt", "⚠ begrenzt", "✓ kostenlos"]

  faq:
    kicker: "/ häufig gestellte fragen"
    title: "Bevor Sie beginnen."
    items:
      - q: "Funktioniert Vexo mit Microsoft Word und Outlook?"
        a_html: "Ja. Vexo funktioniert in jeder Windows-Anwendung, in der Sie schreiben können: Microsoft Word, Outlook, Excel, Google Chrome, Firefox, Slack, Teams, Web-CRMs und jedem anderen Programm. Es ist nicht von Word abhängig — es funktioniert auf Betriebssystemebene."
      - q: "Kann ich meine vorhandenen .docx- und .odt-Vorlagen verwenden?"
        a_html: "Ja. Geben Sie einfach den Ordner an, in dem sich Ihre .docx-, .odt- oder .txt-Dateien befinden, und Vexo erkennt sie automatisch. Kein Konvertieren oder Importieren nötig — Ihre Word-Dateien bleiben normale Word-Dateien."
      - q: "Bleibt die vollständige Formatierung beim Einfügen erhalten — Fettdruck, Tabellen, Bilder?"
        a_html: "Ja, das ist der Hauptvorteil gegenüber anderen Texterweiterungen. Vexo fügt DOCX- oder ODT-Inhalte mit vollständig erhaltener Formatierung ein: Fettdruck, Kursivschrift, Tabellen, Listen, eingebettete Bilder und Absatzformate. Klassische Expander fügen nur reinen Text ein."
      - q: "Werden meine Vorlagen auf einen Server oder in die Cloud hochgeladen?"
        a_html: "Nein. Vexo läuft zu 100 % lokal — Ihre Dateien verlassen niemals Ihren Computer. Es gibt kein Benutzerkonto und keinen eigenen Server. Wenn Sie eine Synchronisierung zwischen Computern wünschen, verweisen Sie den Ordner einfach auf OneDrive, Dropbox oder Google Drive."
      - q: "Was kostet es?"
        a_html: "Nichts. Vexo ist kostenlos – mit allen Funktionen und ohne Vorlagenlimit. Kein Konto, keine Kreditkarte, keine Lizenz zum Aktivieren."
      - q: "Welche Windows-Versionen werden unterstützt?"
        a_html: "Vexo ist mit Windows 10 und Windows 11 (64-Bit) kompatibel. Microsoft Office wird nicht benötigt — es funktioniert mit jeder Anwendung des Systems. Derzeit gibt es keine macOS- oder Linux-Version."
      - q: "Wie unterscheidet es sich von AutoHotkey oder anderen Expandern wie Espanso?"
        a_html: "AutoHotkey erfordert das Schreiben von Skripten — nichts für nicht-technische Nutzer. Espanso und andere Expander verarbeiten reinen Text oder Markdown, fügen aber keine DOCX-Dateien mit vollständiger Formatierung ein. Vexo ist für Menschen gedacht, die mit echten Word-Dokumenten arbeiten und diese in jede Anwendung einfügen möchten, ohne Word zu öffnen."
      - q: "Kann ich es auf mehreren Computern installieren?"
        a_html: "Ja, auf beliebig vielen. Es gibt keine Aktivierung und kein Gerätelimit. Für dieselben Vorlagen auf allen Geräten legen Sie den Ordner in OneDrive, Dropbox oder Google Drive."
      - q: "Kann ich meine E-Mail-Signaturen mit Logos und Bildern speichern?"
        a_html: "Ja. Unter Einstellungen → Signaturen erstellen Sie Ihre Signaturen in einem visuellen Editor oder fügen die ein, die Sie bereits verwenden (kopieren Sie sie mit Strg+C aus Ihrem E-Mail-Programm oder CRM). Bilder werden mit der Signatur gespeichert und hängen von keinem Link ab. Tippen Sie den Auslöser und «firma», um sie in jeder Anwendung einzufügen."

  final_cta:
    title: "Bereit, schneller zu arbeiten?"
    text: "Laden Sie Vexo kostenlos herunter: alle Funktionen, ohne Limits, ohne Registrierung."
    button: "Vexo herunterladen →"


