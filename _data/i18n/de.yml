        text_html: "Die meisten Texterweiterungen zwingen Sie, für jede Vorlage eine eigene Abkürzung zu erfinden — bei 50 Vorlagen sind das 50 Codes, die sich nicht wiederholen dürfen, und einen Monat später wissen Sie nicht mehr, welcher welcher war. Mit Plantillas Macro tippen Sie <code>/</code> und einen beliebigen Teil des Namens: <code>/angebot</code> filtert sofort alles Passende. Kein Auswendiglernen von Codes wie <code>/ang2024v3final</code>."
      - title: "Vollständige Word-Formatierung"
        text_html: "Fügt mit intaktem Fettdruck, Tabellen, Bildern und Formatvorlagen ein. Herkömmliche Texterweiterungen arbeiten meist mit reinem Text — keine davon verarbeitet DOCX oder ODT wirklich."
      - title: "Kein Konto, keine verpflichtende Cloud"
        text_html: "Viele Texterweiterungen erfordern die Erstellung eines Kontos und speichern Ihre Vorlagen auf ihren Servern. Ihre Dateien gehören Ihnen: Sie bleiben in Ihrem Ordner, auf Ihrem Computer."
      - title: "Funktioniert in jeder Anwendung"
        text_html: "Outlook, Word, CRM, Webseiten, Chat und jede Windows-Anwendung, in der Sie schreiben können — ohne Ausnahme."
      - title: "In 2 Minuten einsatzbereit"
        text_html: "Installieren, Ordner angeben und loslegen. Ohne technische Konfiguration oder Dateien, die manuell bearbeitet werden müssen."
      - title: "Synchronisierung ohne Bindung"
        text_html: "Sie können Ihren Ordner auf OneDrive, Dropbox oder Google Drive verweisen, und er synchronisiert sich selbst. Ihre Dokumente bleiben normale .docx-Dateien — wenn Sie eines Tages die App wechseln, verlieren Sie nichts."

