      Sie uns für die beste Lösung →</a>

  faq:
    kicker: "/ häufig gestellte fragen"
    title: "Bevor Sie beginnen."
    items:
      - q: "Funktioniert Plantillas Macro mit Microsoft Word und Outlook?"
        a_html: "Ja. Plantillas Macro funktioniert in jeder Windows-Anwendung, in der Sie schreiben können: Microsoft Word, Outlook, Excel, Google Chrome, Firefox, Slack, Teams, Web-CRMs und jedem anderen Programm. Es ist nicht von Word abhängig — es funktioniert auf Betriebssystemebene."
      - q: "Kann ich meine vorhandenen .docx- und .odt-Vorlagen verwenden?"
        a_html: "Ja. Geben Sie einfach den Ordner an, in dem sich Ihre .docx-, .odt- oder .txt-Dateien befinden, und Plantillas Macro erkennt sie automatisch. Kein Konvertieren oder Importieren nötig — Ihre Word-Dateien bleiben normale Word-Dateien."
      - q: "Bleibt die vollständige Formatierung beim Einfügen erhalten — Fettdruck, Tabellen, Bilder?"
        a_html: "Ja, das ist der Hauptvorteil gegenüber anderen Texterweiterungen. Plantillas Macro fügt DOCX- oder ODT-Inhalte mit vollständig erhaltener Formatierung ein: Fettdruck, Kursivschrift, Tabellen, Listen, eingebettete Bilder und Absatzformate. Klassische Expander fügen nur reinen Text ein."
      - q: "Werden meine Vorlagen auf einen Server oder in die Cloud hochgeladen?"
        a_html: "Nein. Plantillas Macro läuft zu 100 % lokal — Ihre Dateien verlassen niemals Ihren Computer. Es gibt kein Benutzerkonto und keinen eigenen Server. Wenn Sie eine Synchronisierung zwischen Computern wünschen, verweisen Sie den Ordner einfach auf OneDrive, Dropbox oder Google Drive."
      - q: "Wie viel kostet es und gibt es eine kostenlose Testphase?"
        a_html: "Es gibt 14 Tage kostenlose Testphase mit allen Funktionen, ohne Kreditkarte. Danach beginnen die Pläne bei 3,90€/Monat + MwSt. Sie können jederzeit über das Lemon-Squeezy-Panel ohne Strafgebühren kündigen."
      - q: "Welche Windows-Versionen werden unterstützt?"
        a_html: "Plantillas Macro ist mit Windows 10 und Windows 11 (64-Bit) kompatibel. Microsoft Office wird nicht benötigt — es funktioniert mit jeder Anwendung des Systems. Derzeit gibt es keine macOS- oder Linux-Version."
      - q: "Wie unterscheidet es sich von AutoHotkey oder anderen Expandern wie Espanso?"
        a_html: "AutoHotkey erfordert das Schreiben von Skripten — nichts für nicht-technische Nutzer. Espanso und andere Expander verarbeiten reinen Text oder Markdown, fügen aber keine DOCX-Dateien mit vollständiger Formatierung ein. Plantillas Macro ist für Menschen gedacht, die mit echten Word-Dokumenten arbeiten und diese in jede Anwendung einfügen möchten, ohne Word zu öffnen."
      - q: "Kann ich dieselbe Lizenz auf mehreren Computern nutzen?"
        a_html: 'Jede Lizenz erlaubt eine gleichzeitige Aktivierung. Wenn Sie sie auf mehreren Computern nutzen müssen, können Sie den vorherigen Computer direkt in der Software deaktivieren. Für Teams oder Unternehmen mit 25 oder mehr Lizenzen <a href="mailto:gestiona.optimiza@gmail.com">kontaktieren Sie uns</a> für einen individuellen Preis.'

  final_cta:
    title: "Bereit, schneller zu arbeiten?"
    text: "Laden Sie Plantillas Macro kostenlos herunter und testen Sie alle Funktionen 14 Tage lang."
    button: "Plantillas Macro herunterladen →"


