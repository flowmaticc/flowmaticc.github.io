# =====================================================================
# FLOWMATIC — Traducciones ES
# Estructura de datos que alimenta index.html, novedades/index.html,
# utilities/google-auth/index.html y utilities/extension/index.html.
#
# Para traducir a otro idioma: copia este archivo como
# _data/i18n/<código>.yml (ej. en.yml, fr.yml...) y traduce los VALORES
# de texto. No cambies las CLAVES (las de la izquierda de los ":").
# Los campos que terminan en "_html" pueden contener etiquetas HTML
# simples (<strong>, <code>, <a>, <br>) — consérvalas al traducir.
# =====================================================================

home:

  hero:
    kicker: "/ automatización inteligente"
    title_pre: "Escribe /"
    title_highlight: "y tu plantilla aparece."
    copy_html: >-
      <p><strong>Vexo</strong> es el expansor de texto para Windows
      que pega tus plantillas Word, ODT y TXT con formato completo en cualquier
      aplicación.</p>
      <p>Escribe "/" + el nombre y se pega al instante. Sin copiar, sin abrir
      archivos, sin interrumpir tu flujo.</p>
    cta_download: "Descargar gratis →"
    video_aria_label: "Ampliar vídeo del producto"
    video_expand_label: "⤢ Ampliar"
    video_window_title: "VEXO - EXPANSOR"
    video_close_label: "Cerrar"
    video_fallback: "Tu navegador no soporta vídeos HTML5."

  strip:
    - label: "01 / velocidad"
      text: "Escribe y pega. Sin menús ni pasos extra."
    - label: "02 / formato"
      text: "DOCX, ODT y TXT conservando el formato."
    - label: "03 / privacidad"
      text: "Tus archivos permanecen en tu equipo."

  product:
    kicker: "/ producto"
    title: "Diseñado para tu flujo de trabajo."
    intro: "Sin interrupciones, sin pasos extra. Solo escribe y pega."
    features:
      - number: "01"
        title: "Instantáneo"
        text_html: "Escribe <strong>/nombre</strong> y tu plantilla aparece al instante. Sin menús, sin clics extra."
      - number: "02"
        title: "Formato completo"
        text_html: "DOCX, ODT y TXT con negrita, tablas, imágenes y estilos. Todo el formato se mantiene."
      - number: "03"
        title: "100% local"
        text_html: "Tus plantillas están en tu equipo. Sin nubes obligatorias, sin servidores y sin suscripciones."

  why:
    kicker: "/ la diferencia"
    title: "Aquí solo escribes."
    lead_muted: "Otros expansores te obligan a memorizar."
    lead_highlight: "Vexo busca el archivo por ti."
    diagram:
      step1: "Escribe /nombre"
      step2: "Filtra en tiempo real"
      step3: "Se pega con formato"
    items:
      - title: "Sin abreviaturas que memorizar"
        text_html: "La mayoría de expansores te obligan a inventarte una abreviatura única para cada plantilla — con 50 plantillas son 50 códigos que no puedes repetir entre sí, y un mes después ya no recuerdas cuál era cuál. Con Vexo escribes <code>/</code> y cualquier parte del nombre: <code>/presu</code> filtra al instante todo lo que coincide. Nada de memorizar códigos como <code>/prspcl2024v3</code>."
      - title: "Formato Word completo"
        text_html: "Pega con negritas, tablas, imágenes y estilos intactos. Los expansores tradicionales suelen trabajar con texto plano — ninguno maneja DOCX ni ODT de verdad."
      - title: "Sin cuenta, sin nube obligatoria"
        text_html: "Muchos expansores requieren crear una cuenta y almacenan tus plantillas en sus servidores. Tus archivos son tuyos: permanecen en tu carpeta, en tu equipo."
      - title: "Funciona en cualquier app"
        text_html: "Outlook, Word, CRM, webs, chat y cualquier aplicación de Windows donde puedas escribir — sin excepción."
      - title: "Listo en 2 minutos"
        text_html: "Instalas, señalas tu carpeta y empiezas a trabajar. Sin configuración técnica ni archivos que editar a mano."
      - title: "Sync sin lock-in"
        text_html: "Puedes apuntar tu carpeta a OneDrive, Dropbox o Google Drive y se sincroniza sola. Tus documentos siguen siendo archivos .docx normales — si un día cambias de app, no pierdes nada."
      - title: "Firmas de correo con imágenes"
        text_html: "Crea tus firmas con logos e imágenes en un editor visual, o pega la que ya usas en tu correo o CRM. Aparecen en el buscador como «Firma: …» y se pegan con su formato en Gmail, Outlook o tu herramienta de tickets."

  comparison:
    kicker: "/ comparación"
    title: "Qué hace diferente a Vexo."
    headers: ["Característica", "Vexo", "Expansores con abreviaturas", "Expansores de navegador", "Herramientas técnicas"]
    rows:
      - label: "Sin abreviaturas a memorizar"
        cells: ["✓", "✕", "✕", "✕"]
      - label: "Formato DOCX / ODT completo"
        cells: ["✓", "✕ texto plano", "✕", "✕"]
      - label: "Sin cuenta obligatoria"
        cells: ["✓", "⚠ depende", "✕", "✓"]
      - label: "Funciona en apps de escritorio"
        cells: ["✓", "✓", "✕ solo nav.", "✓"]
      - label: "Interfaz sin curva de aprendizaje"
        cells: ["✓", "⚠ compleja", "✓", "✕ código"]
      - label: "Tus archivos, tu carpeta"
        cells: ["✓", "⚠ formato propio", "✕ nube", "✓"]
      - label: "Gratis y sin límites"
        cells: ["✓", "⚠ limitada", "⚠ limitada", "✓ gratis"]

  faq:
    kicker: "/ preguntas frecuentes"
    title: "Antes de empezar."
    items:
      - q: "¿Funciona Vexo con Microsoft Word y Outlook?"
        a_html: "Sí. Vexo funciona en cualquier aplicación de Windows donde puedas escribir: Microsoft Word, Outlook, Excel, Google Chrome, Firefox, Slack, Teams, CRM web y cualquier otro programa. No depende de Word — funciona a nivel del sistema operativo."
      - q: "¿Puedo usar mis plantillas .docx y .odt existentes?"
        a_html: "Sí. Simplemente señala la carpeta donde tienes tus archivos .docx, .odt o .txt y Vexo los detecta automáticamente. No hace falta convertirlos ni importarlos — tus archivos Word siguen siendo archivos Word normales."
      - q: "¿Se mantiene el formato completo al pegar — negritas, tablas, imágenes?"
        a_html: "Sí, es la principal ventaja frente a otros expansores de texto. Vexo pega el contenido DOCX u ODT con toda la formatación intacta: negritas, cursivas, tablas, listas, imágenes incrustadas y estilos de párrafo. Los expansores clásicos solo pegan texto plano."
      - q: "¿Mis plantillas se suben a algún servidor o nube?"
        a_html: "No. Vexo funciona 100% en local — tus archivos nunca salen de tu equipo. No hay cuenta de usuario ni servidor propio. Si quieres sincronización entre equipos, simplemente apunta la carpeta a OneDrive, Dropbox o Google Drive."
      - q: "¿Cuánto cuesta?"
        a_html: "Nada. Vexo es gratis, con todas las funciones y sin límite de plantillas. No necesitas cuenta, tarjeta ni activar ninguna licencia."
      - q: "¿Qué versiones de Windows son compatibles?"
        a_html: "Vexo es compatible con Windows 10 y Windows 11 (64 bits). No requiere instalar Microsoft Office — funciona con cualquier aplicación del sistema. No hay versión para macOS ni Linux por el momento."
      - q: "¿En qué se diferencia de AutoHotkey o de otros expansores como Espanso?"
        a_html: "AutoHotkey requiere programar scripts — no es para usuarios no técnicos. Espanso y otros expansores manejan texto plano o markdown, pero no pegan archivos DOCX con formato completo. Vexo está pensado para quienes trabajan con documentos Word reales y quieren pegarlos en cualquier app sin abrir Word."
      - q: "¿Puedo instalarlo en varios equipos?"
        a_html: "Sí, en todos los que quieras. No hay activaciones ni límite de equipos. Si quieres las mismas plantillas en todos, apunta la carpeta a OneDrive, Dropbox o Google Drive."
      - q: "¿Puedo guardar mis firmas de correo con logos e imágenes?"
        a_html: "Sí. En Ajustes → Firmas creas tus firmas en un editor visual o pegas la que ya usas (cópiala con Ctrl+C desde tu correo o CRM). Las imágenes se guardan junto a la firma, así que no dependen de ningún enlace. Escribe el detonante y «firma» para pegarla en cualquier aplicación."

  final_cta:
    title: "¿Listo para trabajar más rápido?"
    text: "Descarga Vexo gratis: todas las funciones, sin límites y sin registro."
    button: "Descargar Vexo →"


help_faq:

  seo:
    title: "Ayuda y preguntas frecuentes · Vexo"
    description: "Resuelve tus dudas sobre el funcionamiento de Vexo: detonante, formato, sincronización en la nube, extensión de navegador, idiomas y más."

  hero:
    kicker: "/ ayuda"
    title_pre: "Resolvemos"
    title_highlight: "tus dudas."
    copy: "Preguntas frecuentes sobre el funcionamiento de Vexo, organizadas por tema. Iremos ampliando esta sección con más contenido."

  categories:

    - id: "primeros-pasos"
      label: "Primeros pasos"
      items:
        - q: "¿Necesito instalar algo más aparte del programa?"
          a_html: "No. Vexo es autónomo — no requiere Microsoft Office, ni .NET, ni ningún otro componente adicional. Descargas el ZIP, lo descomprimes y ejecutas el programa."
        - q: "¿Dónde se guardan mis plantillas y mis ajustes?"
          a_html: "Las plantillas viven en la carpeta que tú elijas (por defecto, una carpeta <code>Plantillas</code> junto al programa). Los ajustes y preferencias se guardan aparte, en tu carpeta de usuario de Windows, para que no se pierdan si mueves o reinstalas el programa."
        - q: "¿El programa se queda ocupando la barra de tareas todo el rato?"
          a_html: "Puedes minimizarlo a la bandeja del sistema (system tray) para que quede fuera de en medio y siga funcionando en segundo plano, listo para cuando escribas el detonante."
        - q: "Si abro el programa dos veces por error, ¿se duplica?"
          a_html: "No. Vexo detecta que ya hay una instancia abierta y simplemente trae la ventana existente al frente, en vez de abrir una segunda copia."

    - id: "detonante"
      label: "El detonante y el popup"
      items:
        - q: "¿Puedo cambiar el detonante \"/\" por otro símbolo?"
          a_html: "Sí. El \"/\" es el detonante por defecto, pero puedes cambiarlo desde Ajustes por el que prefieras."
        - q: "¿Puedo usar un detonante distinto según la carpeta de plantillas?"
          a_html: "Sí, es posible configurar detonantes personalizados por carpeta — útil si gestionas varios conjuntos de plantillas (por ejemplo, uno para atención al cliente y otro para ventas) y quieres diferenciarlos al escribir."
        - q: "¿Cómo funciona el filtro cuando voy escribiendo?"
          a_html: "En cuanto escribes el detonante, se abre un popup con la lista de plantillas. A partir de ahí, cada letra que escribas filtra la lista en tiempo real comparando con el nombre del archivo — no hace falta escribir el nombre completo ni en orden exacto de inicio."
        - q: "¿Puedo excluir temporalmente una carpeta del detector?"
          a_html: "Sí, puedes excluir una carpeta de forma temporal para que el detector la ignore sin tener que desconfigurarla del todo — útil si quieres dejar de recibir sugerencias de esa carpeta por un tiempo sin perder la configuración."

    - id: "formato"
      label: "Formato y plantillas"
      items:
        - q: "¿Qué formatos de archivo puedo usar como plantilla?"
          a_html: "DOCX, ODT y TXT. Los DOCX y ODT conservan el formato completo al pegarse (negrita, tablas, imágenes, estilos); los TXT se pegan como texto y, si eliges una fuente personalizada en <strong>Ajustes → Formato</strong>, con esa fuente, tamaño y color."
        - q: "¿Se pierde algo del formato original al pegar?"
          a_html: "No debería — el objetivo del programa es precisamente que el DOCX/ODT llegue con la misma formatación que tiene el archivo original: negrita, cursiva, tablas, listas, imágenes incrustadas y estilos de párrafo."
        - q: "¿Puedo tener plantillas con imágenes dentro?"
          a_html: "Sí, las imágenes incrustadas en el DOCX u ODT se pegan junto con el resto del contenido."

    - id: "precio"
      label: "Precio y uso"
      items:
        - q: "¿Tiene algún coste o algún límite?"
          a_html: "No. Vexo es gratis, con todas las funciones activadas y sin límite de plantillas. No hay periodo de prueba, cuenta ni licencia que activar."
        - q: "¿Puedo usarlo en varios ordenadores?"
          a_html: "Sí, en todos los que quieras y sin activar nada. Si quieres las mismas plantillas en todos, apunta la carpeta a OneDrive, Dropbox o Google Drive."
        - q: "¿Necesito conexión a internet para usar el programa?"
          a_html: "No. El programa funciona sin conexión. Solo se conecta, si hay internet, para comprobar si hay una versión nueva del programa o de los idiomas."

    - id: "firmas"
      label: "Firmas de correo"
      items:
        - q: "¿Cómo creo una firma?"
          a_html: "En <strong>Ajustes → Firmas</strong> pulsa <strong>Nueva firma</strong>. Se abre un editor en tu navegador: pega la firma que ya usas (cópiala con Ctrl+C desde tu correo o CRM) o créala desde cero con texto, imágenes, enlaces y colores. Ponle un nombre y pulsa <strong>Guardar firma</strong>."
        - q: "¿Cómo la pego?"
          a_html: "Igual que una plantilla: escribe el detonante y <code>firma</code> (o parte de su nombre). Las firmas aparecen como «Firma: …» en el buscador."
        - q: "¿Dónde se guardan y qué pasa con las imágenes?"
          a_html: "En la carpeta <code>_Firmas</code> dentro de tu carpeta de plantillas, así que se sincronizan si usas OneDrive, Dropbox o Google Drive. Las imágenes se guardan junto a la firma y se incrustan al pegarla: no dependen de ningún enlace externo."
        - q: "Al pegarla veo líneas en blanco que no quería"
          a_html: "Lo que se pega es exactamente lo que ves en el editor. Abre la firma con <strong>Editar</strong>, borra las líneas en blanco sobrantes y vuelve a guardarla."

    - id: "nube"
      label: "Sincronización en la nube"
      items:
        - q: "¿Detecta automáticamente si tengo OneDrive, Dropbox o Google Drive?"
          a_html: "Sí. El programa detecta si tienes alguna de estas tres aplicaciones instaladas y puede sugerirte guardar ahí tu carpeta de plantillas, para que se sincronice sola entre tus equipos."
        - q: "Si sincronizo con la nube, ¿mis plantillas pasan por los servidores de Vexo?"
          a_html: "No. La sincronización la gestiona directamente el servicio de nube que elijas (OneDrive, Dropbox o Google Drive) sobre tu propia carpeta — Vexo no sube ni retransmite ese contenido a ningún servidor propio."

    - id: "extension"
      label: "Extensión de navegador (Position Caret)"
      items:
        - q: "Ya tengo el programa instalado, ¿para qué sirve la extensión?"
          a_html: "El programa por sí solo ya funciona en la mayoría de aplicaciones de escritorio. La extensión mejora la precisión dentro del navegador: le indica al programa la posición exacta del cursor en la página web, para que el popup aparezca justo ahí en vez de en una posición aproximada."
        - q: "Si cierro y vuelvo a abrir el programa, ¿tengo que reconectar la extensión a mano?"
          a_html: "No, la extensión reintenta la conexión automáticamente cada pocos segundos hasta reconectar — no hace falta que hagas nada."
        - q: "¿Funciona si tengo varias pestañas o perfiles de navegador abiertos a la vez?"
          a_html: "Sí, la extensión soporta varios navegadores/perfiles conectados a la vez y prioriza automáticamente el que tiene la ventana con el foco activo en ese momento."

    - id: "idiomas"
      label: "Idiomas"
      items:
        - q: "¿En qué idiomas está disponible la interfaz del programa?"
          a_html: "Español, English, Français, Deutsch, Italiano, Português, Русский (ruso), y además valenciano y catalán. Puedes cambiar el idioma de la interfaz desde Ajustes en cualquier momento."
        - q: "La web está también en chino, ¿el programa también?"
          a_html: "Por ahora no — el programa todavía no incluye el paquete de chino. Si lo necesitas, contáctanos para que sepamos que hay demanda real y podamos priorizarlo."

    - id: "rendimiento"
      label: "Multi-monitor y pantalla"
      items:
        - q: "¿Funciona bien si tengo varios monitores con distinta escala/DPI?"
          a_html: "Sí, el programa es consciente del DPI de cada monitor por separado (per-monitor DPI aware), así que el popup aparece en la posición correcta aunque tengas, por ejemplo, un monitor al 100% y otro al 150% de escala."


