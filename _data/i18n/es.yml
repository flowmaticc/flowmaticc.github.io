      - label: "Tus archivos, tu carpeta"
        cells: ["✓", "⚠ formato propio", "✕ nube", "✓"]
      - label: "14 días de prueba gratuita"
        cells: ["✓", "⚠ limitada", "⚠ limitada", "✓ gratis"]

  pricing:
    kicker: "/ precio"
    title: "Elige tu plan."
    intro: "Sin permanencia. Cancela cuando quieras."
    plans:
      - name: "Mensual"
        tag: ""
        price: "3,90€"
        unit: "/mes"
        description: "+ IVA según tu país"
        features: ["Todas las funciones", "Sin compromiso", "Cancela cuando quieras"]
        button: "Suscribirme →"
        popular: false
        link_key: "buy_mensual"
        umami: "click-buy-mensual"
      - name: "Trimestral"
        tag: "Más popular"
        price: "9,90€"
        unit: "/3 meses"
        description: "3,30€/mes · Ahorra 15%"
        features: ["Todas las funciones", "Renovación trimestral", "Cancela cuando quieras"]
        button: "Elegir Trimestral →"
        popular: true
        link_key: "buy_trimestral"
        umami: "click-buy-trimestral"
      - name: "Anual"
        tag: "Mejor valor"
        price: "35€"
        unit: "/año"
        description: "2,90€/mes · Ahorra 25%"
        features: ["Todas las funciones", "Renovación anual", "Mejor valor"]
        button: "Elegir Anual →"
        popular: false
        link_key: "buy_anual"
        umami: "click-buy-anual"
    note_html: >-
      🔒 Pago seguro vía Lemon Squeezy · 14 días de prueba gratuita · Cancela
      cuando quieras.<br><br>Los precios mostrados no incluyen IVA. El IVA
      aplicable se calcula y añade en el momento del pago según el país de
      residencia del comprador, y es gestionado íntegramente por Lemon Squeezy
      como Merchant of Record.<br><br>¿Necesitas 25 o más licencias para tu
      equipo o empresa? <a href="mailto:gestiona.optimiza@gmail.com?subject=Consulta%20licencias%20volumen%20(%2B25)">Contáctanos
      para valorar la mejor solución →</a>

  faq:
    kicker: "/ preguntas frecuentes"
    title: "Antes de empezar."
    items:
      - q: "¿Funciona Plantillas Macro con Microsoft Word y Outlook?"
        a_html: "Sí. Plantillas Macro funciona en cualquier aplicación de Windows donde puedas escribir: Microsoft Word, Outlook, Excel, Google Chrome, Firefox, Slack, Teams, CRM web y cualquier otro programa. No depende de Word — funciona a nivel del sistema operativo."
      - q: "¿Puedo usar mis plantillas .docx y .odt existentes?"
        a_html: "Sí. Simplemente señala la carpeta donde tienes tus archivos .docx, .odt o .txt y Plantillas Macro los detecta automáticamente. No hace falta convertirlos ni importarlos — tus archivos Word siguen siendo archivos Word normales."
      - q: "¿Se mantiene el formato completo al pegar — negritas, tablas, imágenes?"
        a_html: "Sí, es la principal ventaja frente a otros expansores de texto. Plantillas Macro pega el contenido DOCX u ODT con toda la formatación intacta: negritas, cursivas, tablas, listas, imágenes incrustadas y estilos de párrafo. Los expansores clásicos solo pegan texto plano."
      - q: "¿Mis plantillas se suben a algún servidor o nube?"
        a_html: "No. Plantillas Macro funciona 100% en local — tus archivos nunca salen de tu equipo. No hay cuenta de usuario ni servidor propio. Si quieres sincronización entre equipos, simplemente apunta la carpeta a OneDrive, Dropbox o Google Drive."
      - q: "¿Cuánto cuesta y hay prueba gratuita?"
        a_html: "Hay 14 días de prueba gratuita con todas las funciones incluidas, sin tarjeta de crédito. Después, los planes empiezan desde 3,90€/mes + IVA. Puedes cancelar en cualquier momento desde el panel de Lemon Squeezy sin penalizaciones."
      - q: "¿Qué versiones de Windows son compatibles?"
        a_html: "Plantillas Macro es compatible con Windows 10 y Windows 11 (64 bits). No requiere instalar Microsoft Office — funciona con cualquier aplicación del sistema. No hay versión para macOS ni Linux por el momento."
      - q: "¿En qué se diferencia de AutoHotkey o de otros expansores como Espanso?"
        a_html: "AutoHotkey requiere programar scripts — no es para usuarios no técnicos. Espanso y otros expansores manejan texto plano o markdown, pero no pegan archivos DOCX con formato completo. Plantillas Macro está pensado para quienes trabajan con documentos Word reales y quieren pegarlos en cualquier app sin abrir Word."
      - q: "¿Puedo tener más de un equipo con la misma licencia?"
        a_html: 'Cada licencia permite una activación simultánea. Si necesitas usarla en varios equipos puedes desactivar el equipo anterior desde el mismo software. Para equipos o empresas con 25 o más licencias, <a href="mailto:gestiona.optimiza@gmail.com">contáctanos</a> para un precio personalizado.'

  final_cta:
    title: "¿Listo para trabajar más rápido?"
    text: "Descarga Plantillas Macro gratis y prueba todas las funciones durante 14 días."
    button: "Descargar Plantillas Macro →"


