google_auth:

  hero:
    breadcrumb_current: "Google Auth Extractor"
    kicker: "/ utilidad gratuita · código abierto"
    title_pre: "Google Auth"
    title_highlight: "Extractor"
    copy_es: "Exporta tus cuentas TOTP de Google Authenticator a TXT, Aegis, 2FAS o CSV."
    copy_en: "Export your Google Authenticator TOTP accounts to TXT, Aegis, 2FAS or CSV."
    chips: ["Python 3.10+", "Windows", "macOS", "Linux", "MIT"]
    cta_github: "Ver en GitHub"
    cta_download: "Descargar ZIP →"

  why:
    kicker: "/ motivo"
    title: "¿Por qué existe esta herramienta?"
    text_es_html: "Google Authenticator exporta las cuentas en un formato propietario (<code>otpauth-migration://</code>) que ninguna otra app puede leer directamente. Cada código QR contiene hasta 10 cuentas. Esta herramienta decodifica esos QR y extrae las claves TOTP para que puedas importarlas donde quieras."
    text_en_html: "Google Authenticator exports accounts in a proprietary format (<code>otpauth-migration://</code>) that no other app can read directly. Each QR code holds up to 10 accounts. This tool decodes those QR codes and extracts the TOTP secrets so you can import them anywhere."

  features:
    kicker: "/ características"
    title: "Todo lo que incluye."
    items:
      - "Pegar URL otpauth-migration:// directamente"
      - "Subir imagen o captura del QR"
      - "Escanear región de pantalla con el ratón"
      - "Acumula cuentas entre escaneos"
      - "Deduplicación automática"
      - "Copiar Emisor, Nombre o Clave"
      - "Interfaz en Español e Inglés"
      - "Borrar lista para empezar de cero"
      - "Exportar a TXT, Aegis, 2FAS, CSV"
      - "100% local — ningún dato sale del equipo"

  screenshots:
    kicker: "/ capturas"
    title: "La herramienta en uso."

  installation:
    kicker: "/ instalación"
    title: "Instalación."
    step1_label: "1. Clona el repositorio / Clone the repo"
    requirements_html: '<strong>📌 Requisitos / Requirements:</strong> Python 3.10 o superior. Durante la instalación en Windows, marca <strong>"Add Python to PATH"</strong>.'
    step2_label: "2. Instala las dependencias / Install dependencies"
    linux_note_html: "<strong>🐧 Linux / macOS:</strong> También necesitas la librería nativa de zbar:"

  usage:
    kicker: "/ uso"
    title: "Cómo se ejecuta."
    run_label: "Ejecutar / Run"
    windows_note_html: "<strong>💡 Windows con varias versiones de Python:</strong>"
    batch_note_html: "O crea un archivo <code>ejecutar.bat</code>:"

  guide:
    kicker: "/ guía"
    title: "Paso a paso."
    steps:
      - title: "Exportar desde Google Authenticator"
        text_html: 'Abre Google Authenticator → menú (⋮) → <strong>Exportar cuentas / Transfer accounts → Export accounts</strong> → selecciona las cuentas → aparecerá uno o varios QR (máximo 10 cuentas por QR).'
      - title: "Importar en la app (elige un modo)"
        modes:
          - icon: "🔗"
            title: "Modo URL"
            text_html: 'Escanea el QR → copia la URL <code>otpauth-migration://offline?data=...</code> → pégala → Extraer cuentas'
          - icon: "🖼️"
            title: "Modo imagen"
            text: "Captura de pantalla del QR → Seleccionar imagen → Leer QR y extraer"
          - icon: "📷"
            title: "Modo escaneo pantalla"
            text: "Muestra el QR → Seleccionar región → dibuja rectángulo → extracción automática"
        note: "💡 Si tienes más de 10 cuentas, repite el proceso con cada QR. Las cuentas se acumulan y los duplicados se ignoran."
      - title: "Exportar"
        text: "Una vez con todas las cuentas en el listado, pulsa el botón del formato que necesites:"
    formats:
      - name: "TXT"
        meta: ".txt"
      - name: "Aegis"
        meta: ".json · Android"
      - name: "2FAS"
        meta: ".2fas · Android/iOS"
      - name: "CSV"
        meta: "Bitwarden, 1Password"

  deps:
    kicker: "/ dependencias"
    title: "Qué usa por dentro."
    items:
      - name: "customtkinter"
        text: "interfaz gráfica"
      - name: "pillow"
        text: "lectura de imágenes"
      - name: "pyzbar"
        text: "decodificación QR (principal)"
      - name: "opencv-python"
        text: "decodificación QR (fallback)"
      - name: "mss"
        text: "captura multi-monitor"

  troubleshooting:
    kicker: "/ ayuda"
    title: "Solución de problemas."
    items:
      - icon: "fas fa-camera"
        title: "El escáner de pantalla no funciona"
      - icon: "fab fa-python"
        title: "Varias versiones de Python en Windows"
      - icon: "fas fa-qrcode"
        title: "Error al importar pyzbar en Windows"
        text_html: "<code>pyzbar</code> requiere librerías nativas. Si falla, <code>opencv-python</code> se usa como alternativa automáticamente."

  security:
    kicker: "/ seguridad"
    title: "Sin conexión a internet."
    items:
      - "Sin conexiones de red · No network connections"
      - "Claves TOTP solo en tu equipo · TOTP secrets stay local"
      - "Código fuente auditable · Full source available"

  final_cta:
    title: "Licencia MIT."
    text: "Úsalo, modifícalo y distribúyelo libremente."
    button: "Ver repositorio →"


