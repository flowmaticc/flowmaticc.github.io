google_auth:

  hero:
    breadcrumb_current: "Google Auth Extractor"
    kicker: "/ utilitaire gratuit · open source"
    title_pre: "Google Auth"
    title_highlight: "Extractor"
    copy_es: "Exporta tus cuentas TOTP de Google Authenticator a TXT, Aegis, 2FAS o CSV."
    copy_en: "Export your Google Authenticator TOTP accounts to TXT, Aegis, 2FAS or CSV."
    chips: ["Python 3.10+", "Windows", "macOS", "Linux", "MIT"]
    cta_github: "Voir sur GitHub"
    cta_download: "Télécharger le ZIP →"

  why:
    kicker: "/ pourquoi"
    title: "Pourquoi cet outil existe-t-il ?"
    text_es_html: "Google Authenticator exporta las cuentas en un formato propietario (<code>otpauth-migration://</code>) que ninguna otra app puede leer directamente. Cada código QR contiene hasta 10 cuentas. Esta herramienta decodifica esos QR y extrae las claves TOTP para que puedas importarlas donde quieras."
    text_en_html: "Google Authenticator exports accounts in a proprietary format (<code>otpauth-migration://</code>) that no other app can read directly. Each QR code holds up to 10 accounts. This tool decodes those QR codes and extracts the TOTP secrets so you can import them anywhere."

  features:
    kicker: "/ fonctionnalités"
    title: "Tout ce qu'il inclut."
    items:
      - "Coller l''URL otpauth-migration:// directement"
      - "Charger une image ou capture du QR"
      - "Scanner une région d'écran avec la souris"
      - "Accumule les comptes entre les scans"
      - "Déduplication automatique"
      - "Copier l'émetteur, le nom ou la clé secrète"
      - "Interface en espagnol et anglais"
      - "Effacer la liste pour repartir de zéro"
      - "Exporter en TXT, Aegis, 2FAS, CSV"
      - "100 % local — aucune donnée ne quitte votre ordinateur"

  screenshots:
    kicker: "/ captures d'écran"
    title: "L'outil en action."

  installation:
    kicker: "/ installation"
    title: "Installation."
    step1_label: "1. Clonez le dépôt"
    requirements_html: '<strong>📌 Prérequis :</strong> Python 3.10 ou supérieur. Lors de l''installation sous Windows, cochez <strong>"Add Python to PATH"</strong>.'
    step2_label: "2. Installez les dépendances"
    linux_note_html: "<strong>🐧 Linux / macOS :</strong> Vous avez aussi besoin de la bibliothèque native zbar :"

  usage:
    kicker: "/ utilisation"
    title: "Comment l'exécuter."
    run_label: "Exécuter"
    windows_note_html: "<strong>💡 Windows avec plusieurs versions de Python :</strong>"
    batch_note_html: "Ou créez un fichier <code>executer.bat</code> :"

  guide:
    kicker: "/ guide"
    title: "Étape par étape."
    steps:
      - title: "Exporter depuis Google Authenticator"
        text_html: 'Ouvrez Google Authenticator → menu (⋮) → <strong>Transférer les comptes → Exporter les comptes</strong> → sélectionnez les comptes → un ou plusieurs QR apparaîtront (max 10 comptes par QR).'
      - title: "Importer dans l'application (choisissez un mode)"
        modes:
          - icon: "🔗"
            title: "Mode URL"
            text_html: 'Scannez le QR → copiez l''URL <code>otpauth-migration://offline?data=...</code> → collez-la → Extraire les comptes'
          - icon: "🖼️"
            title: "Mode image"
            text: "Capture d'écran du QR → Sélectionner l'image → Lire le QR et extraire"
          - icon: "📷"
            title: "Mode scan écran"
            text: "Affichez le QR → Sélectionner la région → dessinez un rectangle → extraction automatique"
        note: "💡 Si vous avez plus de 10 comptes, répétez le processus pour chaque QR. Les comptes s'accumulent et les doublons sont ignorés."
      - title: "Exporter"
        text: "Une fois tous vos comptes dans la liste, cliquez sur le bouton du format dont vous avez besoin :"
    formats:
      - name: "TXT"
        meta: ".txt"
      - name: "Aegis"
        meta: ".json · Android"
      - name: "2FAS"
        meta: ".2fas · Android/iOS"
      - name: "CSV"
        meta: "Bitwarden, 1Password"

  deps:
    kicker: "/ dépendances"
    title: "Ce qu'il utilise en interne."
    items:
      - name: "customtkinter"
        text: "interface graphique"
      - name: "pillow"
        text: "lecture d'images"
      - name: "pyzbar"
        text: "décodage QR (principal)"
      - name: "opencv-python"
        text: "décodage QR (secours)"
      - name: "mss"
        text: "capture multi-écrans"

  troubleshooting:
    kicker: "/ aide"
    title: "Dépannage."
    items:
      - icon: "fas fa-camera"
        title: "Le scanner d'écran ne fonctionne pas"
      - icon: "fab fa-python"
        title: "Plusieurs versions de Python sous Windows"
      - icon: "fas fa-qrcode"
        title: "Erreur lors de l'importation de pyzbar sous Windows"
        text_html: "<code>pyzbar</code> nécessite des bibliothèques natives. En cas d'échec, <code>opencv-python</code> est utilisé automatiquement comme solution de secours."

  security:
    kicker: "/ sécurité"
    title: "Sans connexion internet."
    items:
      - "Aucune connexion réseau"
      - "Les clés TOTP restent sur votre ordinateur"
      - "Code source complet disponible pour audit"

  final_cta:
    title: "Licence MIT."
    text: "Utilisez-le, modifiez-le et distribuez-le librement."
    button: "Voir le dépôt →"


