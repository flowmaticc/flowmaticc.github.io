home:

  hero:
    kicker: "/ automazione intelligente"
    title_pre: "Scrivi /"
    title_highlight: "e il tuo modello appare."
    copy_html: >-
      <p><strong>Plantillas Macro</strong> è l'espansore di testo per
      Windows che incolla i tuoi modelli Word, ODT e TXT con formattazione
      completa in qualsiasi applicazione.</p>
      <p>Scrivi "/" + il nome e viene incollato all'istante. Senza copiare,
      senza aprire file, senza interrompere il tuo flusso di lavoro.</p>
    cta_download: "Scarica gratis →"
    cta_pricing: "Vedi i prezzi"
    video_aria_label: "Ingrandisci il video del prodotto"
    video_expand_label: "⤢ Ingrandisci"
    video_window_title: "PLANTILLAS MACRO"
    video_close_label: "Chiudi"
    video_fallback: "Il tuo browser non supporta i video HTML5."

  strip:
    - label: "01 / velocità"
      text: "Scrivi e incolla. Senza menu né passaggi extra."
    - label: "02 / formato"
      text: "DOCX, ODT e TXT con la formattazione conservata."
    - label: "03 / privacy"
      text: "I tuoi file restano sul tuo computer."

  product:
    kicker: "/ prodotto"
    title: "Progettato per il tuo flusso di lavoro."
    intro: "Senza interruzioni, senza passaggi extra. Basta scrivere e incollare."
    features:
      - number: "01"
        title: "Istantaneo"
        text_html: "Scrivi <strong>/nome</strong> e il tuo modello appare all'istante. Senza menu, senza clic extra."
      - number: "02"
        title: "Formattazione completa"
        text_html: "DOCX, ODT e TXT con grassetto, tabelle, immagini e stili. Tutta la formattazione viene mantenuta."
      - number: "03"
        title: "100% locale"
        text_html: "I tuoi modelli restano sul tuo computer. Senza cloud obbligatorio, senza server e senza abbonamenti nascosti."

  why:
    kicker: "/ la differenza"
    title: "Qui devi solo scrivere."
    lead_muted: "Altri espansori ti obbligano a memorizzare."
    lead_highlight: "Plantillas Macro cerca il file al posto tuo."
    diagram:
      step1: "Scrivi /nome"
      step2: "Filtra in tempo reale"
      step3: "Incolla con formattazione"
    items:
      - title: "Nessuna abbreviazione da memorizzare"
        text_html: "La maggior parte degli espansori ti obbliga a inventare un'abbreviazione unica per ogni modello — con 50 modelli sono 50 codici che non puoi ripetere, e un mese dopo non ricordi più quale fosse quale. Con Plantillas Macro scrivi <code>/</code> e qualsiasi parte del nome: <code>/preventivo</code> filtra all'istante tutto ciò che corrisponde. Niente più memorizzare codici come <code>/prev2024v3final</code>."
      - title: "Formattazione Word completa"
        text_html: "Incolla con grassetto, tabelle, immagini e stili intatti. Gli espansori tradizionali lavorano di solito con testo semplice — nessuno gestisce davvero DOCX o ODT."
      - title: "Senza account, senza cloud obbligatorio"
        text_html: "Molti espansori richiedono la creazione di un account e memorizzano i tuoi modelli sui loro server. I tuoi file sono tuoi: restano nella tua cartella, sul tuo computer."
      - title: "Funziona in qualsiasi app"
        text_html: "Outlook, Word, CRM, siti web, chat e qualsiasi applicazione Windows in cui puoi scrivere — senza eccezioni."
      - title: "Pronto in 2 minuti"
        text_html: "Installi, indichi la tua cartella e inizi a lavorare. Senza configurazione tecnica né file da modificare manualmente."
      - title: "Sincronizzazione senza vincoli"
        text_html: "Puoi puntare la tua cartella su OneDrive, Dropbox o Google Drive e si sincronizza da sola. I tuoi documenti restano normali file .docx — se un giorno cambi app, non perdi nulla."

  comparison:
    kicker: "/ confronto"
    title: "Cosa rende Plantillas Macro diverso."
    headers: ["Caratteristica", "Plantillas Macro", "Espansori con abbreviazioni", "Espansori da browser", "Strumenti tecnici"]
    rows:
      - label: "Nessuna abbreviazione da memorizzare"
        cells: ["✓", "✕", "✕", "✕"]
      - label: "Formattazione DOCX / ODT completa"
        cells: ["✓", "✕ testo semplice", "✕", "✕"]
      - label: "Nessun account obbligatorio"
        cells: ["✓", "⚠ dipende", "✕", "✓"]
      - label: "Funziona in app desktop"
        cells: ["✓", "✓", "✕ solo browser", "✓"]
      - label: "Interfaccia senza curva di apprendimento"
        cells: ["✓", "⚠ complessa", "✓", "✕ richiede codice"]
      - label: "I tuoi file, la tua cartella"
        cells: ["✓", "⚠ formato proprietario", "✕ cloud", "✓"]
      - label: "14 giorni di prova gratuita"
        cells: ["✓", "⚠ limitata", "⚠ limitata", "✓ gratis"]

  pricing:
    kicker: "/ prezzo"
    title: "Scegli il tuo piano."
    intro: "Senza vincoli. Annulla quando vuoi."
    plans:
      - name: "Mensile"
        tag: ""
        price: "3,90€"
        unit: "/mese"
        description: "+ IVA secondo il tuo paese"
        features: ["Tutte le funzioni", "Nessun vincolo", "Annulla quando vuoi"]
        button: "Abbonati →"
        popular: false
        link_key: "buy_mensual"
        umami: "click-buy-mensual-it"
      - name: "Trimestrale"
        tag: "Più popolare"
        price: "9,90€"
        unit: "/3 mesi"
        description: "3,30€/mese · Risparmia il 15%"
        features: ["Tutte le funzioni", "Rinnovo trimestrale", "Annulla quando vuoi"]
        button: "Scegli Trimestrale →"
        popular: true
        link_key: "buy_trimestral"
        umami: "click-buy-trimestral-it"
      - name: "Annuale"
        tag: "Miglior valore"
        price: "35€"
        unit: "/anno"
        description: "2,90€/mese · Risparmia il 25%"
        features: ["Tutte le funzioni", "Rinnovo annuale", "Miglior valore"]
        button: "Scegli Annuale →"
        popular: false
        link_key: "buy_anual"
        umami: "click-buy-anual-it"
    note_html: >-
      🔒 Pagamento sicuro tramite Lemon Squeezy · 14 giorni di prova gratuita
      · Annulla quando vuoi.<br><br>I prezzi mostrati non includono l'IVA.
      L'IVA applicabile viene calcolata e aggiunta al momento del pagamento
      in base al paese di residenza dell'acquirente, ed è gestita interamente
      da Lemon Squeezy come Merchant of Record.<br><br>Hai bisogno di 25 o
      più licenze per il tuo team o azienda?
      <a href="mailto:gestiona.optimiza@gmail.com?subject=Richiesta%20licenze%20volume%20(%2B25)">Contattaci
      per trovare la soluzione migliore →</a>

  faq:
    kicker: "/ domande frequenti"
    title: "Prima di iniziare."
    items:
      - q: "Plantillas Macro funziona con Microsoft Word e Outlook?"
        a_html: "Sì. Plantillas Macro funziona in qualsiasi applicazione Windows in cui puoi scrivere: Microsoft Word, Outlook, Excel, Google Chrome, Firefox, Slack, Teams, CRM web e qualsiasi altro programma. Non dipende da Word — funziona a livello di sistema operativo."
      - q: "Posso usare i miei modelli .docx e .odt esistenti?"
        a_html: "Sì. Basta indicare la cartella in cui si trovano i tuoi file .docx, .odt o .txt e Plantillas Macro li rileva automaticamente. Non serve convertirli né importarli — i tuoi file Word restano normali file Word."
      - q: "La formattazione completa viene mantenuta quando incolli — grassetto, tabelle, immagini?"
        a_html: "Sì, è il principale vantaggio rispetto ad altri espansori di testo. Plantillas Macro incolla il contenuto DOCX o ODT con tutta la formattazione intatta: grassetto, corsivo, tabelle, elenchi, immagini incorporate e stili di paragrafo. Gli espansori classici incollano solo testo semplice."
      - q: "I miei modelli vengono caricati su qualche server o cloud?"
        a_html: "No. Plantillas Macro funziona al 100% in locale — i tuoi file non lasciano mai il tuo computer. Non c'è account utente né server proprietario. Se vuoi la sincronizzazione tra computer, basta puntare la cartella su OneDrive, Dropbox o Google Drive."
      - q: "Quanto costa e c'è una prova gratuita?"
        a_html: "Ci sono 14 giorni di prova gratuita con tutte le funzioni incluse, senza carta di credito. Dopo, i piani partono da 3,90€/mese + IVA. Puoi annullare in qualsiasi momento dal pannello Lemon Squeezy senza penali."
      - q: "Quali versioni di Windows sono supportate?"
        a_html: "Plantillas Macro è compatibile con Windows 10 e Windows 11 (64 bit). Non richiede Microsoft Office — funziona con qualsiasi applicazione del sistema. Al momento non esiste una versione per macOS né Linux."
      - q: "In cosa si differenzia da AutoHotkey o da altri espansori come Espanso?"
        a_html: "AutoHotkey richiede di scrivere script — non è per utenti non tecnici. Espanso e altri espansori gestiscono testo semplice o markdown, ma non incollano file DOCX con formattazione completa. Plantillas Macro è pensato per chi lavora con documenti Word reali e vuole incollarli in qualsiasi app senza aprire Word."
      - q: "Posso usare la stessa licenza su più computer?"
        a_html: 'Ogni licenza consente un''attivazione simultanea. Se devi usarla su più computer, puoi disattivare il computer precedente direttamente dal software. Per team o aziende con 25 o più licenze, <a href="mailto:gestiona.optimiza@gmail.com">contattaci</a> per un prezzo personalizzato.'

  final_cta:
    title: "Pronto a lavorare più velocemente?"
    text: "Scarica Plantillas Macro gratis e prova tutte le funzioni per 14 giorni."
    button: "Scarica Plantillas Macro →"


