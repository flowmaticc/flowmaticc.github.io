google_auth:

  hero:
    breadcrumb_current: "Google Auth Extractor"
    kicker: "/ strumento gratuito · open source"
    title_pre: "Google Auth"
    title_highlight: "Extractor"
    copy_es: "Exporta tus cuentas TOTP de Google Authenticator a TXT, Aegis, 2FAS o CSV."
    copy_en: "Export your Google Authenticator TOTP accounts to TXT, Aegis, 2FAS or CSV."
    chips: ["Python 3.10+", "Windows", "macOS", "Linux", "MIT"]
    cta_github: "Vedi su GitHub"
    cta_download: "Scarica ZIP →"

  why:
    kicker: "/ perché"
    title: "Perché esiste questo strumento?"
    text_es_html: "Google Authenticator exporta las cuentas en un formato propietario (<code>otpauth-migration://</code>) que ninguna otra app puede leer directamente. Cada código QR contiene hasta 10 cuentas. Esta herramienta decodifica esos QR y extrae las claves TOTP para que puedas importarlas donde quieras."
    text_en_html: "Google Authenticator exports accounts in a proprietary format (<code>otpauth-migration://</code>) that no other app can read directly. Each QR code holds up to 10 accounts. This tool decodes those QR codes and extracts the TOTP secrets so you can import them anywhere."

  features:
    kicker: "/ caratteristiche"
    title: "Tutto quello che include."
    items:
      - "Incolla l'URL otpauth-migration:// direttamente"
      - "Carica immagine o screenshot del QR"
      - "Scansiona una regione dello schermo con il mouse"
      - "Accumula account tra più scansioni"
      - "Deduplicazione automatica"
      - "Copia Emittente, Nome o Chiave"
      - "Interfaccia in spagnolo e inglese"
      - "Cancella l'elenco per ricominciare da zero"
      - "Esporta in TXT, Aegis, 2FAS, CSV"
      - "100% locale — nessun dato lascia il tuo computer"

  screenshots:
    kicker: "/ screenshot"
    title: "Lo strumento in azione."

  installation:
    kicker: "/ installazione"
    title: "Installazione."
    step1_label: "1. Clona il repository"
    requirements_html: '<strong>📌 Requisiti:</strong> Python 3.10 o superiore. Durante l''installazione su Windows, spunta <strong>"Add Python to PATH"</strong>.'
    step2_label: "2. Installa le dipendenze"
    linux_note_html: "<strong>🐧 Linux / macOS:</strong> Ti serve anche la libreria nativa zbar:"

  usage:
    kicker: "/ utilizzo"
    title: "Come si esegue."
    run_label: "Esegui"
    windows_note_html: "<strong>💡 Windows con più versioni di Python:</strong>"
    batch_note_html: "Oppure crea un file <code>esegui.bat</code>:"

  guide:
    kicker: "/ guida"
    title: "Passo dopo passo."
    steps:
      - title: "Esportare da Google Authenticator"
        text_html: 'Apri Google Authenticator → menu (⋮) → <strong>Trasferisci account → Esporta account</strong> → seleziona gli account → apparirà uno o più QR (massimo 10 account per QR).'
      - title: "Importare nell'app (scegli una modalità)"
        modes:
          - icon: "🔗"
            title: "Modalità URL"
            text_html: 'Scansiona il QR → copia l''URL <code>otpauth-migration://offline?data=...</code> → incollala → Estrai account'
          - icon: "🖼️"
            title: "Modalità immagine"
            text: "Screenshot del QR → Seleziona immagine → Leggi QR ed estrai"
          - icon: "📷"
            title: "Modalità scansione schermo"
            text: "Mostra il QR → Seleziona regione → disegna un rettangolo → estrazione automatica"
        note: "💡 Se hai più di 10 account, ripeti il processo per ogni QR. Gli account si accumulano e i duplicati vengono ignorati."
      - title: "Esportare"
        text: "Una volta che tutti gli account sono nell'elenco, clicca sul pulsante del formato di cui hai bisogno:"
    formats:
      - name: "TXT"
        meta: ".txt"
      - name: "Aegis"
        meta: ".json · Android"
      - name: "2FAS"
        meta: ".2fas · Android/iOS"
      - name: "CSV"
        meta: "Bitwarden, 1Password"

  deps:
    kicker: "/ dipendenze"
    title: "Cosa usa internamente."
    items:
      - name: "customtkinter"
        text: "interfaccia grafica"
      - name: "pillow"
        text: "lettura immagini"
      - name: "pyzbar"
        text: "decodifica QR (principale)"
      - name: "opencv-python"
        text: "decodifica QR (fallback)"
      - name: "mss"
        text: "cattura multi-monitor"

  troubleshooting:
    kicker: "/ aiuto"
    title: "Risoluzione dei problemi."
    items:
      - icon: "fas fa-camera"
        title: "Lo scanner dello schermo non funziona"
      - icon: "fab fa-python"
        title: "Più versioni di Python su Windows"
      - icon: "fas fa-qrcode"
        title: "Errore durante l'importazione di pyzbar su Windows"
        text_html: "<code>pyzbar</code> richiede librerie native. Se fallisce, <code>opencv-python</code> viene usato automaticamente come alternativa."

  security:
    kicker: "/ sicurezza"
    title: "Senza connessione a internet."
    items:
      - "Nessuna connessione di rete"
      - "Le chiavi TOTP restano sul tuo computer"
      - "Codice sorgente completo disponibile per l'audit"

  final_cta:
    title: "Licenza MIT."
    text: "Usalo, modificalo e distribuiscilo liberamente."
    button: "Vedi repository →"


