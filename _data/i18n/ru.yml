      версии · Отмена в любое время.<br><br>Указанные цены не включают НДС.
      Применимый НДС рассчитывается и добавляется при оплате в зависимости от
      страны проживания покупателя и полностью управляется Lemon Squeezy как
      Merchant of Record.<br><br>Нужно 25 или больше лицензий для вашей
      команды или компании?
      <a href="mailto:gestiona.optimiza@gmail.com?subject=Запрос%20на%20объемные%20лицензии%20(%2B25)">Свяжитесь
      с нами, чтобы найти лучшее решение →</a>

  faq:
    kicker: "/ часто задаваемые вопросы"
    title: "Прежде чем начать."
    items:
      - q: "Работает ли Plantillas Macro с Microsoft Word и Outlook?"
        a_html: "Да. Plantillas Macro работает в любом приложении Windows, где можно печатать текст: Microsoft Word, Outlook, Excel, Google Chrome, Firefox, Slack, Teams, веб-CRM и любых других программах. Он не зависит от Word — работает на уровне операционной системы."
      - q: "Могу ли я использовать свои существующие шаблоны .docx и .odt?"
        a_html: "Да. Просто укажите папку, где находятся ваши файлы .docx, .odt или .txt, и Plantillas Macro обнаружит их автоматически. Не нужно их конвертировать или импортировать — ваши файлы Word остаются обычными файлами Word."
      - q: "Сохраняется ли полное форматирование при вставке — жирный шрифт, таблицы, изображения?"
        a_html: "Да, это главное преимущество перед другими расширителями текста. Plantillas Macro вставляет содержимое DOCX или ODT с полностью сохранённым форматированием: жирным шрифтом, курсивом, таблицами, списками, встроенными изображениями и стилями абзацев. Классические расширители вставляют только обычный текст."
      - q: "Загружаются ли мои шаблоны на какой-либо сервер или в облако?"
        a_html: "Нет. Plantillas Macro работает на 100% локально — ваши файлы никогда не покидают ваш компьютер. Нет учётной записи пользователя или собственного сервера. Если вы хотите синхронизацию между компьютерами, просто укажите в качестве папки OneDrive, Dropbox или Google Drive."
      - q: "Сколько это стоит и есть ли бесплатная пробная версия?"
        a_html: "Есть 14-дневная бесплатная пробная версия со всеми функциями, без банковской карты. После этого тарифы начинаются от 3,90€/месяц + НДС. Вы можете отменить подписку в любой момент через панель Lemon Squeezy без штрафов."
      - q: "Какие версии Windows поддерживаются?"
        a_html: "Plantillas Macro совместим с Windows 10 и Windows 11 (64-bit). Microsoft Office не требуется — работает с любым приложением системы. Версии для macOS или Linux пока нет."
      - q: "Чем он отличается от AutoHotkey или других расширителей вроде Espanso?"
        a_html: "AutoHotkey требует написания скриптов — это не для нетехнических пользователей. Espanso и другие расширители работают с обычным текстом или markdown, но не вставляют файлы DOCX с полным форматированием. Plantillas Macro создан для тех, кто работает с настоящими документами Word и хочет вставлять их в любое приложение, не открывая Word."
      - q: "Могу ли я использовать одну лицензию на нескольких компьютерах?"
        a_html: 'Каждая лицензия допускает одну одновременную активацию. Если вам нужно использовать её на нескольких компьютерах, вы можете деактивировать предыдущий компьютер прямо в программе. Для команд или компаний с 25 и более лицензиями <a href="mailto:gestiona.optimiza@gmail.com">свяжитесь с нами</a> для получения индивидуальной цены.'

  final_cta:
    title: "Готовы работать быстрее?"
    text: "Скачайте Plantillas Macro бесплатно и попробуйте все функции в течение 14 дней."
    button: "Скачать Plantillas Macro →"


