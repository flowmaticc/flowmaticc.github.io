  why:
    kicker: "/ отличие"
    title: "Здесь вы просто печатаете."
    lead_muted: "Другие расширители заставляют вас запоминать."
    lead_highlight: "Plantillas Macro сам находит файл за вас."
    diagram:
      step1: "Введите /название"
      step2: "Фильтрует в реальном времени"
      step3: "Вставляет с форматированием"
    items:
      - title: "Никаких сокращений для запоминания"
        text_html: "Большинство расширителей текста заставляют придумывать уникальное сокращение для каждого шаблона — при 50 шаблонах это 50 кодов, которые нельзя повторять, а через месяц вы уже не помните, какой был какой. С Plantillas Macro вы вводите <code>/</code> и любую часть названия: <code>/смета</code> мгновенно отфильтрует всё подходящее. Никаких кодов вроде <code>/см2024v3финал</code> запоминать не нужно."
      - title: "Полное форматирование Word"
        text_html: "Вставляет с сохранением жирного шрифта, таблиц, изображений и стилей. Традиционные расширители обычно работают с обычным текстом — ни один по-настоящему не поддерживает DOCX или ODT."
      - title: "Без аккаунта, без обязательного облака"
        text_html: "Многие расширители требуют создания аккаунта и хранят ваши шаблоны на своих серверах. Ваши файлы принадлежат вам: они остаются в вашей папке, на вашем компьютере."
      - title: "Работает в любом приложении"
        text_html: "Outlook, Word, CRM, сайты, чаты и любое приложение Windows, где можно печатать текст — без исключений."
      - title: "Готов за 2 минуты"
        text_html: "Устанавливаете, указываете папку и начинаете работать. Без технической настройки и файлов для ручного редактирования."
      - title: "Синхронизация без привязки"
        text_html: "Вы можете указать в качестве папки OneDrive, Dropbox или Google Drive, и она будет синхронизироваться сама. Ваши документы остаются обычными файлами .docx — если однажды вы смените приложение, вы ничего не потеряете."

  comparison:
    kicker: "/ сравнение"
    title: "Чем отличается Plantillas Macro."
    headers: ["Характеристика", "Plantillas Macro", "Расширители с сокращениями", "Расширители браузера", "Технические инструменты"]
