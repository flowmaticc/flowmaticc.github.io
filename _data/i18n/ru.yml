      - label: "Интерфейс без кривой обучения"
        cells: ["✓", "⚠ сложный", "✓", "✕ нужен код"]
      - label: "Ваши файлы, ваша папка"
        cells: ["✓", "⚠ свой формат", "✕ облако", "✓"]
