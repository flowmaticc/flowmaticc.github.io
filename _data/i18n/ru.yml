google_auth:

  hero:
    breadcrumb_current: "Google Auth Extractor"
    kicker: "/ бесплатный инструмент · открытый код"
    title_pre: "Google Auth"
    title_highlight: "Extractor"
    copy_es: "Exporta tus cuentas TOTP de Google Authenticator a TXT, Aegis, 2FAS o CSV."
    copy_en: "Export your Google Authenticator TOTP accounts to TXT, Aegis, 2FAS or CSV."
    chips: ["Python 3.10+", "Windows", "macOS", "Linux", "MIT"]
    cta_github: "Смотреть на GitHub"
    cta_download: "Скачать ZIP →"

  why:
    kicker: "/ зачем"
    title: "Зачем нужен этот инструмент?"
    text_es_html: "Google Authenticator exporta las cuentas en un formato propietario (<code>otpauth-migration://</code>) que ninguna otra app puede leer directamente. Cada código QR contiene hasta 10 cuentas. Esta herramienta decodifica esos QR y extrae las claves TOTP para que puedas importarlas donde quieras."
    text_en_html: "Google Authenticator exports accounts in a proprietary format (<code>otpauth-migration://</code>) that no other app can read directly. Each QR code holds up to 10 accounts. This tool decodes those QR codes and extracts the TOTP secrets so you can import them anywhere."

  features:
    kicker: "/ возможности"
    title: "Всё, что включено."
    items:
      - "Вставка URL otpauth-migration:// напрямую"
      - "Загрузка изображения или скриншота QR-кода"
      - "Сканирование области экрана мышью"
      - "Накопление аккаунтов между сканированиями"
      - "Автоматическое устранение дубликатов"
      - "Копирование издателя, имени или секретного ключа"
      - "Интерфейс на испанском и английском языках"
      - "Очистка списка для начала с нуля"
      - "Экспорт в TXT, Aegis, 2FAS, CSV"
      - "100% локально — никакие данные не покидают ваш компьютер"

  screenshots:
    kicker: "/ скриншоты"
    title: "Инструмент в действии."

  installation:
    kicker: "/ установка"
    title: "Установка."
    step1_label: "1. Клонируйте репозиторий"
    requirements_html: '<strong>📌 Требования:</strong> Python 3.10 или выше. При установке в Windows отметьте <strong>"Add Python to PATH"</strong>.'
    step2_label: "2. Установите зависимости"
    linux_note_html: "<strong>🐧 Linux / macOS:</strong> Также понадобится нативная библиотека zbar:"

  usage:
    kicker: "/ использование"
    title: "Как запустить."
    run_label: "Запустить"
    windows_note_html: "<strong>💡 Windows с несколькими версиями Python:</strong>"
    batch_note_html: "Или создайте файл <code>run.bat</code>:"

  guide:
    kicker: "/ инструкция"
    title: "Шаг за шагом."
    steps:
      - title: "Экспорт из Google Authenticator"
        text_html: 'Откройте Google Authenticator → меню (⋮) → <strong>Перенос аккаунтов → Экспорт аккаунтов</strong> → выберите аккаунты → появится один или несколько QR-кодов (максимум 10 аккаунтов на QR-код).'
      - title: "Импорт в приложение (выберите режим)"
        modes:
          - icon: "🔗"
            title: "Режим URL"
            text_html: 'Отсканируйте QR-код → скопируйте URL <code>otpauth-migration://offline?data=...</code> → вставьте его → Извлечь аккаунты'
          - icon: "🖼️"
            title: "Режим изображения"
            text: "Скриншот QR-кода → Выбрать изображение → Считать QR-код и извлечь"
          - icon: "📷"
            title: "Режим сканирования экрана"
            text: "Покажите QR-код → Выбрать область → нарисуйте прямоугольник → автоматическое извлечение"
        note: "💡 Если у вас больше 10 аккаунтов, повторите процесс для каждого QR-кода. Аккаунты накапливаются, а дубликаты игнорируются."
      - title: "Экспорт"
        text: "Когда все аккаунты окажутся в списке, нажмите кнопку нужного формата:"
    formats:
      - name: "TXT"
        meta: ".txt"
      - name: "Aegis"
        meta: ".json · Android"
      - name: "2FAS"
        meta: ".2fas · Android/iOS"
      - name: "CSV"
        meta: "Bitwarden, 1Password"

  deps:
    kicker: "/ зависимости"
    title: "Что используется внутри."
    items:
      - name: "customtkinter"
        text: "графический интерфейс"
      - name: "pillow"
        text: "чтение изображений"
      - name: "pyzbar"
        text: "декодирование QR (основное)"
      - name: "opencv-python"
        text: "декодирование QR (резервное)"
      - name: "mss"
        text: "захват с нескольких мониторов"

  troubleshooting:
    kicker: "/ помощь"
    title: "Решение проблем."
    items:
      - icon: "fas fa-camera"
        title: "Сканер экрана не работает"
      - icon: "fab fa-python"
        title: "Несколько версий Python в Windows"
      - icon: "fas fa-qrcode"
        title: "Ошибка импорта pyzbar в Windows"
        text_html: "<code>pyzbar</code> требует нативных библиотек. В случае сбоя автоматически используется <code>opencv-python</code> в качестве резервного варианта."

  security:
    kicker: "/ безопасность"
    title: "Без подключения к интернету."
    items:
      - "Никаких сетевых подключений"
      - "Секретные ключи TOTP остаются на вашем компьютере"
      - "Полный исходный код доступен для проверки"

  final_cta:
    title: "Лицензия MIT."
    text: "Используйте, изменяйте и распространяйте свободно."
    button: "Смотреть репозиторий →"


