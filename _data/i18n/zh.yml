google_auth:

  hero:
    breadcrumb_current: "Google Auth Extractor"
    kicker: "/ 免费工具 · 开源"
    title_pre: "Google Auth"
    title_highlight: "Extractor"
    copy_es: "Exporta tus cuentas TOTP de Google Authenticator a TXT, Aegis, 2FAS o CSV."
    copy_en: "Export your Google Authenticator TOTP accounts to TXT, Aegis, 2FAS or CSV."
    chips: ["Python 3.10+", "Windows", "macOS", "Linux", "MIT"]
    cta_github: "在 GitHub 上查看"
    cta_download: "下载 ZIP →"

  why:
    kicker: "/ 为什么"
    title: "为什么会有这个工具？"
    text_es_html: "Google Authenticator exporta las cuentas en un formato propietario (<code>otpauth-migration://</code>) que ninguna otra app puede leer directamente. Cada código QR contiene hasta 10 cuentas. Esta herramienta decodifica esos QR y extrae las claves TOTP para que puedas importarlas donde quieras."
    text_en_html: "Google Authenticator exports accounts in a proprietary format (<code>otpauth-migration://</code>) that no other app can read directly. Each QR code holds up to 10 accounts. This tool decodes those QR codes and extracts the TOTP secrets so you can import them anywhere."

  features:
    kicker: "/ 功能特性"
    title: "包含的所有功能。"
    items:
      - "直接粘贴 otpauth-migration:// 链接"
      - "上传二维码图片或截图"
      - "用鼠标扫描屏幕区域"
      - "多次扫描间可累积账户"
      - "自动去重"
      - "复制发行方、名称或密钥"
      - "西班牙语和英语界面"
      - "清空列表以重新开始"
      - "导出为 TXT、Aegis、2FAS、CSV"
      - "100% 本地运行——不会有任何数据离开您的电脑"

  screenshots:
    kicker: "/ 截图"
    title: "工具实际使用效果。"

  installation:
    kicker: "/ 安装"
    title: "安装。"
    step1_label: "1. 克隆代码仓库"
    requirements_html: '<strong>📌 系统要求：</strong>Python 3.10 或更高版本。在 Windows 上安装时，请勾选 <strong>"Add Python to PATH"</strong>。'
    step2_label: "2. 安装依赖项"
    linux_note_html: "<strong>🐧 Linux / macOS：</strong>您还需要原生的 zbar 库："

  usage:
    kicker: "/ 使用方法"
    title: "如何运行。"
    run_label: "运行"
    windows_note_html: "<strong>💡 Windows 上有多个 Python 版本时：</strong>"
    batch_note_html: "或者创建一个 <code>run.bat</code> 文件："

  guide:
    kicker: "/ 使用指南"
    title: "分步说明。"
    steps:
      - title: "从 Google Authenticator 导出"
        text_html: '打开 Google Authenticator → 菜单 (⋮) → <strong>转移账号 → 导出账号</strong> → 选择账号 → 会出现一个或多个二维码（每个二维码最多 10 个账号）。'
      - title: "导入到应用程序中（选择一种方式）"
        modes:
          - icon: "🔗"
            title: "链接模式"
            text_html: '扫描二维码 → 复制 <code>otpauth-migration://offline?data=...</code> 链接 → 粘贴 → 提取账号'
          - icon: "🖼️"
            title: "图片模式"
            text: "截取二维码 → 选择图片 → 读取二维码并提取"
          - icon: "📷"
            title: "屏幕扫描模式"
            text: "显示二维码 → 选择区域 → 画出矩形框 → 自动提取"
        note: "💡 如果您有超过 10 个账号，请对每个二维码重复此过程。账号会不断累积，重复项会被自动忽略。"
      - title: "导出"
        text: "当所有账号都在列表中后，点击您需要的格式对应的按钮："
    formats:
      - name: "TXT"
        meta: ".txt"
      - name: "Aegis"
        meta: ".json · Android"
      - name: "2FAS"
        meta: ".2fas · Android/iOS"
      - name: "CSV"
        meta: "Bitwarden, 1Password"

  deps:
    kicker: "/ 依赖项"
    title: "内部使用的技术。"
    items:
      - name: "customtkinter"
        text: "图形界面"
      - name: "pillow"
        text: "图片读取"
      - name: "pyzbar"
        text: "二维码解码（主要方式）"
      - name: "opencv-python"
        text: "二维码解码（备用方式）"
      - name: "mss"
        text: "多显示器截屏"

  troubleshooting:
    kicker: "/ 帮助"
    title: "故障排除。"
    items:
      - icon: "fas fa-camera"
        title: "屏幕扫描功能无法使用"
      - icon: "fab fa-python"
        title: "Windows 上安装了多个 Python 版本"
      - icon: "fas fa-qrcode"
        title: "在 Windows 上导入 pyzbar 时出错"
        text_html: "<code>pyzbar</code> 需要原生库支持。如果失败，系统会自动使用 <code>opencv-python</code> 作为备用方案。"

  security:
    kicker: "/ 安全性"
    title: "无需互联网连接。"
    items:
      - "无网络连接"
      - "TOTP 密钥仅保存在您的电脑上"
      - "完整源代码可供审查"

  final_cta:
    title: "MIT 开源许可证。"
    text: "自由使用、修改和分发。"
    button: "查看代码仓库 →"


