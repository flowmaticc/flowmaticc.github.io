      →</a>

  faq:
    kicker: "/ 常见问题"
    title: "开始之前。"
    items:
      - q: "Plantillas Macro 能与 Microsoft Word 和 Outlook 配合使用吗？"
        a_html: "可以。Plantillas Macro 可在任何可输入文字的 Windows 应用程序中使用：Microsoft Word、Outlook、Excel、Google Chrome、Firefox、Slack、Teams、网页版 CRM 以及其他任何程序。它不依赖于 Word——而是在操作系统层面运行。"
      - q: "我可以使用已有的 .docx 和 .odt 模板吗？"
        a_html: "可以。只需指定存放 .docx、.odt 或 .txt 文件的文件夹，Plantillas Macro 会自动检测它们。无需转换或导入——您的 Word 文件仍然是普通的 Word 文件。"
      - q: "粘贴时是否保留完整格式——粗体、表格、图片？"
        a_html: "是的，这是相较于其他文本扩展工具的主要优势。Plantillas Macro 粘贴 DOCX 或 ODT 内容时会完整保留格式：粗体、斜体、表格、列表、嵌入图片和段落样式。传统扩展工具只能粘贴纯文本。"
      - q: "我的模板会上传到服务器或云端吗？"
        a_html: "不会。Plantillas Macro 完全本地运行——您的文件永远不会离开您的电脑。没有用户账户，也没有专用服务器。如果您想在多台电脑间同步，只需将文件夹指向 OneDrive、Dropbox 或 Google Drive。"
      - q: "费用是多少？有免费试用吗？"
        a_html: "有 14 天免费试用，包含所有功能，无需信用卡。之后，套餐起价为 €3.90/月 + 增值税。您可以随时通过 Lemon Squeezy 面板取消，无任何违约金。"
      - q: "支持哪些 Windows 版本？"
        a_html: "Plantillas Macro 兼容 Windows 10 和 Windows 11（64位）。无需安装 Microsoft Office——可与系统中任何应用程序配合使用。目前暂无 macOS 或 Linux 版本。"
      - q: "它与 AutoHotkey 或 Espanso 等其他扩展工具有何不同？"
        a_html: "AutoHotkey 需要编写脚本——不适合非技术用户。Espanso 和其他扩展工具处理纯文本或 Markdown，但无法粘贴带完整格式的 DOCX 文件。Plantillas Macro 专为需要处理真实 Word 文档、并希望在任何应用中粘贴而无需打开 Word 的用户设计。"
      - q: "同一个授权许可可以在多台电脑上使用吗？"
        a_html: '每个授权许可允许一次同时激活。如果您需要在多台电脑上使用，可以直接在软件内停用之前的电脑。如果您的团队或公司需要 25 个或更多授权许可，请<a href="mailto:gestiona.optimiza@gmail.com">联系我们</a>获取定制报价。'

  final_cta:
    title: "准备好更高效地工作了吗？"
    text: "免费下载 Plantillas Macro，14 天内体验全部功能。"
    button: "下载 Plantillas Macro →"


