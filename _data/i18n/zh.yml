        text_html: "您的模板保存在电脑本地。无需强制使用云端，无需服务器，也没有隐藏订阅。"

  why:
    kicker: "/ 与众不同"
    title: "在这里，您只需要打字。"
    lead_muted: "其他文本扩展工具需要您记住各种代码。"
    lead_highlight: "Plantillas Macro 会替您找到文件。"
    diagram:
      step1: "输入 /名称"
      step2: "实时筛选"
      step3: "粘贴并保留格式"
    items:
      - title: "无需记忆缩写代码"
        text_html: "大多数文本扩展工具要求您为每个模板发明一个独特的缩写——50 个模板就是 50 个不能重复的代码，一个月后您就记不清哪个是哪个了。使用 Plantillas Macro，您只需输入 <code>/</code> 加名称的任意部分：<code>/报价</code> 即可立即筛选出所有匹配项。再也不用记住像 <code>/bj2024v3final</code> 这样的代码。"
      - title: "完整的 Word 格式支持"
        text_html: "粘贴时保留粗体、表格、图片和样式。传统文本扩展工具通常只能处理纯文本——没有一个能真正支持 DOCX 或 ODT。"
      - title: "无需账户，无需强制云端"
        text_html: "许多文本扩展工具要求创建账户，并将您的模板存储在他们的服务器上。您的文件属于您自己：始终保存在您的文件夹、您的电脑中。"
      - title: "适用于任何应用程序"
        text_html: "Outlook、Word、CRM、网页、聊天工具，以及任何可以输入文字的 Windows 应用程序——没有例外。"
      - title: "2 分钟即可上手"
        text_html: "安装、指定文件夹，即可开始工作。无需技术配置，无需手动编辑任何文件。"
      - title: "同步无锁定"
        text_html: "您可以将文件夹指向 OneDrive、Dropbox 或 Google Drive，它会自动同步。您的文档始终是普通的 .docx 文件——即使有一天更换其他应用，也不会丢失任何内容。"

  comparison:
